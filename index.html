<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SHEIKAH SLATE SENSOR</title>
  <style>
    :root {
      --sheikah-cyan: #00f3ff;
      --sheikah-cyan-glow: rgba(0, 243, 255, 0.7);
      --sheikah-orange: #ff9d00;
      --sheikah-orange-glow: rgba(255, 157, 0, 0.85);
      --sheikah-gold: #c5a059;
      --sheikah-gold-dark: #6e5426;
      --sheikah-bg: #111417;
      --sheikah-panel: #1b2228;
      --sheikah-border: #3b3226;
      --sheikah-danger: #ff4d4d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
    }

    body {
      background-color: #080a0d;
      color: #e0f8ff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: var(--sheikah-bg);
      border-left: 2px solid var(--sheikah-border);
      border-right: 2px solid var(--sheikah-border);
      display: flex;
      flex-direction: column;
    }

    #arrival-flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 300;
    }
    .flash-anim {
      animation: arrival-screen-flash 0.8s ease-out forwards;
    }
    @keyframes arrival-screen-flash {
      0% { opacity: 0.85; background: var(--sheikah-cyan); }
      30% { opacity: 0.5; background: #fff; }
      100% { opacity: 0; }
    }

    .top-left-ctrl {
      position: absolute;
      top: calc(max(env(safe-area-inset-top), 36px) + 6px);
      left: 18px;
      z-index: 25;
    }
    .top-right-ctrl {
      position: absolute;
      top: calc(max(env(safe-area-inset-top), 36px) + 6px);
      right: 18px;
      z-index: 25;
    }

    .top-icon-btn {
      width: 36px;
      height: 36px;
      background: rgba(3, 8, 14, 0.85);
      border: 1.5px solid var(--sheikah-gold);
      color: var(--sheikah-gold);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.9);
      transition: all 0.2s;
    }
    .top-icon-btn:active {
      background: var(--sheikah-gold);
      color: #000;
    }
    .top-icon-btn.active {
      border-color: var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      background: rgba(0, 243, 255, 0.15);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    }

    .lang-toggle-btn {
      background: rgba(3, 8, 14, 0.85);
      border: 1.5px solid var(--sheikah-gold);
      color: var(--sheikah-gold);
      font-size: 0.78rem;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .lang-toggle-btn:active {
      background: var(--sheikah-gold);
      color: #000;
    }

    .top-section {
      width: 100%;
      height: 52vh;
      position: relative;
      background: radial-gradient(circle at center, #262c33 0%, #111417 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding-top: max(env(safe-area-inset-top), 32px);
    }

    .sheikah-divider-bar {
      width: 100%;
      height: 6px;
      background: linear-gradient(135deg, var(--sheikah-gold) 0%, var(--sheikah-gold-dark) 50%, var(--sheikah-gold) 100%);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.9), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      z-index: 10;
      flex-shrink: 0;
    }

    .relic-circuit {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.35;
      background: 
        radial-gradient(circle at 10% 15%, var(--sheikah-orange) 2px, transparent 3px),
        radial-gradient(circle at 90% 85%, var(--sheikah-cyan) 2px, transparent 3px);
    }

    .circle-map-wrapper {
      position: relative;
      width: min(86vw, 330px);
      height: min(86vw, 330px);
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, var(--sheikah-gold) 0%, var(--sheikah-gold-dark) 50%, var(--sheikah-gold) 100%);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 10px #000;
      margin-top: 8px;
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .circle-map-wrapper.signal-idle {
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 10px #000;
      animation: none;
    }
    .circle-map-wrapper.signal-level1 {
      box-shadow: 0 0 20px var(--sheikah-cyan-glow), inset 0 0 10px var(--sheikah-cyan);
      animation: ring-pulse-1 2.5s infinite ease-in-out;
    }
    .circle-map-wrapper.signal-level2 {
      box-shadow: 0 0 32px var(--sheikah-cyan), inset 0 0 14px #fff;
      animation: ring-pulse-2 1.5s infinite ease-in-out;
    }
    .circle-map-wrapper.signal-level3 {
      box-shadow: 0 0 42px var(--sheikah-cyan), 0 0 20px var(--sheikah-orange), inset 0 0 18px #fff;
      animation: ring-pulse-3 0.8s infinite ease-in-out;
    }
    .circle-map-wrapper.signal-level4 {
      box-shadow: 0 0 55px var(--sheikah-orange), 0 0 30px var(--sheikah-cyan), inset 0 0 25px #fff;
      animation: ring-pulse-4 0.45s infinite ease-in-out;
      border: 2px solid #fff;
    }

    @keyframes ring-pulse-1 {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.01); filter: brightness(1.2); }
    }
    @keyframes ring-pulse-2 {
      0%, 100% { transform: scale(1); filter: brightness(1.1); }
      50% { transform: scale(1.02); filter: brightness(1.35); }
    }
    @keyframes ring-pulse-3 {
      0%, 100% { transform: scale(1); filter: brightness(1.2); }
      50% { transform: scale(1.03); filter: brightness(1.55); }
    }
    @keyframes ring-pulse-4 {
      0%, 100% { transform: scale(1.01); filter: brightness(1.4) contrast(1.2); }
      50% { transform: scale(1.05); filter: brightness(1.9) contrast(1.5); }
    }

    #map-container {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: #03080e;
    }

    #map {
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center center;
    }

    .gm-style-cc, .gmnoprint, a[href^="https://maps.google.com/maps"] {
      display: none !important;
    }

    .player-pointer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-bottom: 22px solid var(--sheikah-cyan);
      filter: drop-shadow(0 0 10px var(--sheikah-cyan));
      pointer-events: none;
      z-index: 5;
    }

    .radar-pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid var(--sheikah-cyan);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
    }

    .pulse-anim {
      animation: pulse-out-anim 0.65s ease-out forwards;
    }
    .pulse-double-anim {
      animation: pulse-out-double 0.4s ease-out forwards;
    }

    @keyframes pulse-out-anim {
      0% { width: 30px; height: 30px; opacity: 1; border-color: #fff; }
      100% { width: 340px; height: 340px; opacity: 0; border-color: var(--sheikah-cyan); }
    }
    @keyframes pulse-out-double {
      0% { width: 30px; height: 30px; opacity: 1; border-color: var(--sheikah-orange); }
      100% { width: 340px; height: 340px; opacity: 0; border-color: #fff; }
    }

    /* 下部：操作パネル */
    .bottom-section {
      width: 100%;
      height: 48vh;
      background: var(--sheikah-panel);
      padding: 10px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
      height: 46px;
    }

    .keyword-input-wrap {
      flex: 1;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
    }

    .keyword-input-wrap input {
      width: 100%;
      height: 100%;
      background: rgba(3, 8, 14, 0.9);
      border: 1.5px solid var(--sheikah-gold);
      color: var(--sheikah-cyan);
      padding: 0 38px 0 12px;
      font-size: 0.98rem;
      border-radius: 6px;
      outline: none;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    }
    .keyword-input-wrap input:focus {
      border-color: var(--sheikah-cyan);
      box-shadow: 0 0 10px var(--sheikah-cyan-glow);
    }

    .btn-input-clear {
      position: absolute;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0, 243, 255, 0.15);
      border: 1px solid var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      font-size: 0.75rem;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-input-clear.show {
      display: flex;
    }

    .dial-lock {
      width: 72px;
      height: 46px;
      background: linear-gradient(180deg, #111 0%, #2f271a 50%, #111 100%);
      border: 1.5px solid var(--sheikah-gold);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
      flex-shrink: 0;
    }
    .dial-label {
      font-size: 0.58rem;
      color: var(--sheikah-orange);
      letter-spacing: 1px;
    }
    .dial-value {
      font-size: 0.88rem;
      font-weight: bold;
      color: var(--sheikah-cyan);
    }

    .btn-set {
      height: 46px;
      padding: 0 16px;
      background: rgba(0, 243, 255, 0.15);
      border: 1.5px solid var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
      flex-shrink: 0;
    }
    .btn-set:active {
      background: var(--sheikah-cyan);
      color: #000;
    }

    .status-panel {
      background: rgba(3, 8, 14, 0.65);
      border: 1px solid #334;
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .target-meta-info {
      font-size: 0.78rem;
      color: var(--sheikah-cyan);
      margin-bottom: 2px;
      opacity: 0.95;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .unknown-badge {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .unknown-count {
      font-size: 1.45rem;
      font-weight: bold;
      color: var(--sheikah-orange);
      text-shadow: 0 0 8px var(--sheikah-orange);
    }

    .search-status-badge {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      max-width: 55%;
    }

    .status-indicator {
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .status-indicator.active {
      color: var(--sheikah-cyan);
      animation: blink-anim 1.5s infinite;
    }
    .status-indicator.paused {
      color: #889;
    }

    @keyframes blink-anim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .dual-btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-sheikah {
      background: rgba(197, 160, 89, 0.1);
      border: 1.5px solid var(--sheikah-gold);
      color: var(--sheikah-gold);
      padding: 10px;
      font-size: 0.88rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .btn-sheikah:active {
      background: var(--sheikah-gold);
      color: #000;
    }

    .svg-icon {
      width: 15px;
      height: 15px;
      fill: currentColor;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .btn-pause-toggle {
      background: rgba(0, 243, 255, 0.12);
      border-color: var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.25);
    }
    .btn-pause-toggle.paused {
      background: rgba(197, 160, 89, 0.08);
      border-color: #667788;
      color: #8899aa;
      box-shadow: none;
    }

    .btn-sub-control {
      flex: 1;
      border-color: #556677;
      color: #778899;
      background: rgba(20, 25, 30, 0.6);
      font-size: 0.78rem;
    }
    .btn-sub-control.active {
      border-color: var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      background: rgba(0, 243, 255, 0.15);
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
    }

    .app-version-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.62rem;
      color: #556270;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* ===================================================
       スライド画面共通
    =================================================== */
    .slide-page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--sheikah-bg);
      z-index: 100;
      display: none;
      flex-direction: column;
    }
    .slide-page.open {
      display: flex;
    }

    .page-header {
      padding-top: calc(max(env(safe-area-inset-top), 48px) + 12px);
      padding-bottom: 14px;
      padding-left: 16px;
      padding-right: 16px;
      background: #151a20;
      border-bottom: 2px solid var(--sheikah-gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .back-btn {
      color: var(--sheikah-cyan);
      background: rgba(0, 243, 255, 0.1);
      border: 1.5px solid var(--sheikah-cyan);
      font-size: 0.88rem;
      font-weight: bold;
      cursor: pointer;
      padding: 7px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .back-btn:active {
      background: var(--sheikah-cyan);
      color: #000;
    }

    /* モノトーン調ホームSVGショートカットボタン */
    .btn-home-shortcut {
      color: var(--sheikah-gold);
      background: rgba(197, 160, 89, 0.12);
      border: 1.5px solid var(--sheikah-gold);
      cursor: pointer;
      padding: 7px 11px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .btn-home-shortcut:active {
      background: var(--sheikah-gold);
      color: #000;
    }

    .page-title-text {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--sheikah-gold);
      letter-spacing: 0.5px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .filter-bar {
      padding: 10px 14px;
      background: rgba(0,0,0,0.4);
      display: flex;
      gap: 8px;
      align-items: center;
      height: 58px;
    }

    .sheikah-input-wrap {
      flex: 1;
      height: 42px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .sheikah-input-wrap input {
      width: 100%;
      height: 100%;
      background: rgba(3, 8, 14, 0.9);
      border: 1.5px solid var(--sheikah-gold);
      color: var(--sheikah-cyan);
      padding: 0 32px 0 10px;
      font-size: 0.9rem;
      border-radius: 6px;
      outline: none;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.8);
    }
    .sheikah-input-wrap input:focus {
      border-color: var(--sheikah-cyan);
      box-shadow: 0 0 8px var(--sheikah-cyan-glow);
    }

    .sheikah-select-box {
      flex: 1;
      height: 42px;
      background: linear-gradient(180deg, #111 0%, #2b2214 50%, #111 100%);
      border: 1.5px solid var(--sheikah-gold);
      color: var(--sheikah-cyan);
      padding: 0 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: bold;
      outline: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }

    .action-sub-bar {
      padding: 6px 16px 10px 16px;
      background: rgba(0,0,0,0.4);
      display: flex;
      justify-content: flex-end;
    }
    .btn-clean-zero {
      background: rgba(255, 77, 77, 0.12);
      border: 1px solid var(--sheikah-danger);
      color: var(--sheikah-danger);
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-clean-zero:active {
      background: var(--sheikah-danger);
      color: #fff;
    }

    .list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .list-item {
      background: rgba(27, 34, 40, 0.95);
      border: 1px solid var(--sheikah-border);
      border-left: 5px solid var(--sheikah-gold);
      padding: 12px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-item:active {
      background: rgba(45, 55, 65, 0.95);
    }

    .list-item-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .list-item-left {
      flex: 1;
      min-width: 0;
    }

    .list-item-title {
      font-weight: bold;
      font-size: 1.05rem;
      color: #fff;
      white-space: normal;
      word-break: break-word;
      line-height: 1.35;
      display: block;
    }

    .list-item-sub {
      font-size: 0.78rem;
      color: #99a;
      margin-top: 4px;
    }

    .item-right-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-sheikah-sm {
      padding: 6px 12px;
      font-size: 0.76rem;
      font-weight: bold;
      background: rgba(0, 243, 255, 0.12);
      border: 1.5px solid var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-sheikah-sm:active {
      background: var(--sheikah-cyan);
      color: #000;
    }
    .btn-sheikah-sm.off {
      border-color: #666;
      color: #888;
      background: transparent;
    }

    .btn-copy-sm {
      border-color: var(--sheikah-gold);
      color: var(--sheikah-gold);
      background: rgba(197, 160, 89, 0.1);
    }

    .btn-danger-sm {
      border-color: var(--sheikah-danger);
      color: var(--sheikah-danger);
      background: rgba(255, 77, 77, 0.12);
    }
    .btn-danger-sm:active {
      background: var(--sheikah-danger);
      color: #fff;
    }

    .action-button-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding-top: 6px;
      border-top: 1px dashed rgba(255,255,255,0.08);
      flex-wrap: wrap;
    }

    /* ===================================================
       第4画面：スポット詳細（ミニマップ＆現地写真カルーセル）
    =================================================== */
    #page-spot-detail {
      z-index: 150;
    }
    .spot-detail-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .detail-card-panel {
      background: rgba(27, 34, 40, 0.95);
      border: 1.5px solid var(--sheikah-gold);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    }
    .spot-name-header {
      font-size: 1.25rem;
      font-weight: bold;
      color: #fff;
      line-height: 1.35;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .spot-address-text {
      font-size: 0.82rem;
      color: #99aabb;

    const mapContrastBtn = document.getElementById('map-style-toggle-btn');

    // ===================================================
    // 1. Web Audio API 音源
    // ===================================================
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      try {
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
      } catch (e) {}
    }

    window.addEventListener('touchstart', () => { initAudio(); }, { once: true });
    window.addEventListener('click', () => { initAudio(); }, { once: true });

    function playBeep(freq = 1800, duration = 0.12) {
      if (appState.isMuted) return;
      if (!audioCtx) initAudio();
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.05, audioCtx.currentTime + duration * 0.7);

        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playDoubleBeep() {
      if (appState.isMuted) return;
      playBeep(2300, 0.07);
      setTimeout(() => {
        playBeep(2450, 0.07);
      }, 85);
    }

    function playTreasureFanfare() {
      if ('vibrate' in navigator) {
        navigator.vibrate([200, 100, 300, 100, 600]);
      }

      if (appState.isMuted) return;
      if (!audioCtx) initAudio();
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50, 1174.66, 1318.51];
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          if (!audioCtx) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

          const dur = (idx === notes.length - 1) ? 1.5 : 0.18;
          gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        }, idx * 115);
      });
    }

    // ===================================================
    // 2. 状態管理
    // ===================================================
    const RADIUS_OPTIONS = [100, 1000, 3000, 10000, 50000, 100000];
    
    let savedRadiusIdx = parseInt(localStorage.getItem('sheikah_last_radius_idx') || '2', 10);
    let radiusIndex = isNaN(savedRadiusIdx) ? 2 : savedRadiusIdx;
    let savedLastKeyword = localStorage.getItem('sheikah_last_keyword') || "マクドナルド";

    let appState = {
      isTracking: false,
      isPaused: false,
      isMuted: false,
      wakeLockActive: true,
      currentPos: null,
      lastSearchedPos: null,

      currentHeading: 0,
      visualMapRotation: 0,
      lastCompassHeading: null,

      locationHistory: [],
      isWalking: false,
      lastWalkTimestamp: 0,

      activeKeyword: savedLastKeyword,
      selectedKeywordForHistory: null,
      selectedSpotForDetail: null,
      places: [],
      pinpointTarget: null
    };

    let wakeLockSentinel = null;
    let watchId = null;
    let compassActive = false;
    let placesService = null;
    let isSearchInProgress = false;
    let detailMinimapInstance = null;

    function loadSavedData() {
      const data = localStorage.getItem('sheikah_db_v1');
      if (data) return JSON.parse(data);
      return { keywordHistory: {}, arrivals: [] };
    }

    function saveAppData(db) {
      localStorage.setItem('sheikah_db_v1', JSON.stringify(db));
    }

    // ===================================================
    // 3. Google Maps
    // ===================================================
    let map = null;

    function initMap(lat, lng) {
      if (typeof google === 'undefined' || !google.maps) return;
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat, lng },
        zoom: 17,
        disableDefaultUI: true,
        styles: currentMapStyleMode === 'high' ? mapStyleHighContrast : mapStyleNormal,
        gestureHandling: 'none'
      });
      placesService = new google.maps.places.PlacesService(map);
    }

    // ===================================================
    // 4. 幾何計算 ＆ センサーロジック
    // ===================================================
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    let radarTimer = null;
    let scheduledInterval = null;

    function updateVisualRing(level) {
      const ring = document.getElementById('circle-map-wrapper');
      if (!ring) return;
      ring.className = `circle-map-wrapper signal-${level}`;
    }

    function evaluateSensorCycle() {
      const countEl = document.getElementById('unknown-count');
      const distInfoEl = document.getElementById('distance-info');
      const t = I18N[currentLang];

      if (!appState.isTracking || appState.isPaused || !appState.currentPos) {
        if (radarTimer) { clearTimeout(radarTimer); radarTimer = null; }
        scheduledInterval = null;
        updateVisualRing('idle');
        countEl.textContent = "--";
        if (appState.isPaused) distInfoEl.textContent = "--";
        return;
      }

      let activeTargets = [];
      if (appState.pinpointTarget) {
        activeTargets = [appState.pinpointTarget];
      } else {
        const db = loadSavedData();
        activeTargets = appState.places.filter(p => {
          const item = db.arrivals.find(a => a.id === p.id);
          return !item || !item.muted;
        });
      }

      countEl.textContent = activeTargets.length;

      if (activeTargets.length === 0) {
        if (!distInfoEl.textContent.includes("API")) {
          distInfoEl.textContent = t.noSpotsInRange;
        }
        if (radarTimer) { clearTimeout(radarTimer); radarTimer = null; }
        scheduledInterval = null;
        updateVisualRing('idle');
        return;
      }

      let closestTarget = null;
      let minDistance = Infinity;
      let targetBearingDiff = 0;

      activeTargets.forEach(tItem => {
        const d = getDistance(appState.currentPos.lat, appState.currentPos.lng, tItem.lat, tItem.lng);
        if (d < minDistance) {
          minDistance = d;
          closestTarget = tItem;
          const bearing = getBearing(appState.currentPos.lat, appState.currentPos.lng, tItem.lat, tItem.lng);
          let diff = Math.abs(appState.currentHeading - bearing);
          if (diff > 180) diff = 360 - diff;
          targetBearingDiff = diff;
        }
      });

      if (minDistance <= 20) {
        handleArrival(closestTarget);
        return;
      }

      let interval = null;
      let level = 'idle';

      if (targetBearingDiff >= 90) {
        level = 'idle';
        interval = null;
      } else if (minDistance <= 50 && targetBearingDiff <= 20) {
        level = 'level4';
        interval = 450;
      } else if ((minDistance <= 120 && targetBearingDiff <= 35) || (minDistance <= 50 && targetBearingDiff <= 55)) {
        level = 'level3';
        interval = 800;
      } else if (minDistance <= 300 && targetBearingDiff <= 55) {
        level = 'level2';
        interval = 1500;
      } else if (targetBearingDiff < 85) {
        level = 'level1';
        interval = 2600;
      }

      updateVisualRing(level);

      if (!distInfoEl.textContent.includes("API")) {
        distInfoEl.textContent = (level === 'idle') ? t.noSpotsInRange : t.spotDetected;
      }

      if (interval !== null) {
        scheduleRadarSound(interval, level === 'level4');
      } else {
        if (radarTimer) { clearTimeout(radarTimer); radarTimer = null; }
        scheduledInterval = null;
      }
    }

    function scheduleRadarSound(interval, isDoubleBeep = false) {
      if (radarTimer && scheduledInterval === interval) {
        return;
      }

      if (radarTimer) clearTimeout(radarTimer);
      scheduledInterval = interval;

      function pulse() {
        if (!appState.isTracking || appState.isPaused) {
          radarTimer = null;
          scheduledInterval = null;
          return;
        }

        if (isDoubleBeep) {
          playDoubleBeep();
        } else {
          playBeep(interval <= 900 ? 2100 : 1750);
        }

        const wave = document.getElementById('radar-pulse');
        if (wave) {
          wave.className = 'radar-pulse-ring';
          void wave.offsetWidth;
          wave.classList.add(isDoubleBeep ? 'pulse-double-anim' : 'pulse-anim');
        }

        radarTimer = setTimeout(pulse, interval);
      }
      pulse();
    }

    function handleArrival(target) {
      const flash = document.getElementById('arrival-flash-overlay');
      if (flash) {
        flash.classList.remove('flash-anim');
        void flash.offsetWidth;
        flash.classList.add('flash-anim');
      }

      playTreasureFanfare();

      const db = loadSavedData();
      const now = new Date().toISOString();
      const existing = db.arrivals.find(a => a.id === target.id);
      if (!existing) {
        db.arrivals.push({
          id: target.id,
          name: target.name,
          keyword: appState.activeKeyword,
          lat: target.lat,
          lng: target.lng,
          date: now,
          muted: true
        });
      }
      if (!db.keywordHistory[appState.activeKeyword]) {
        db.keywordHistory[appState.activeKeyword] = { lastSearch: now, lastArrival: now };
      } else {
        db.keywordHistory[appState.activeKeyword].lastArrival = now;
      }
      saveAppData(db);

      if (map) {
        new google.maps.Marker({
          position: { lat: target.lat, lng: target.lng },
          map: map,
          title: target.name,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: "#00f3ff",
            fillOpacity: 1,
            strokeWeight: 2,
            strokeColor: "#ffffff"
          }
        });
      }

      const t = I18N[currentLang];
      const toast = document.getElementById('toast-banner');
      document.getElementById('toast-text').textContent = t.toastRecorded(target.name);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 5000);

      if (appState.pinpointTarget) {
        appState.pinpointTarget = null;
        executeSearch();
      }

      setTimeout(() => {
        evaluateSensorCycle();
      }, 1500);
    }

    // ===================================================
    // 5. 直進安定化（移動ベクトルの平滑化）
    // ===================================================
    function rotateMapSmoothly(targetBearing) {
      const mapDiv = document.getElementById('map');
      if (!mapDiv) return;

      const desiredAngle = -targetBearing;
      let diff = (desiredAngle - appState.visualMapRotation) % 360;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;

      appState.visualMapRotation += diff;
      mapDiv.style.transform = `rotate(${appState.visualMapRotation}deg)`;
    }

    function calculateSmoothedHeading(newPos) {
      appState.locationHistory.push({ lat: newPos.lat, lng: newPos.lng, time: Date.now() });
      if (appState.locationHistory.length > 5) {
        appState.locationHistory.shift();
      }

      if (appState.locationHistory.length < 2) return null;

      const oldest = appState.locationHistory[0];
      const totalMoved = getDistance(oldest.lat, oldest.lng, newPos.lat, newPos.lng);
      if (totalMoved < 2.5) {
        return null;
      }

      let sinSum = 0;
      let cosSum = 0;
      for (let i = 1; i < appState.locationHistory.length; i++) {
        const p1 = appState.locationHistory[i - 1];
        const p2 = appState.locationHistory[i];
        const d = getDistance(p1.lat, p1.lng, p2.lat, p2.lng);
        if (d > 0.5) {
          const b = getBearing(p1.lat, p1.lng, p2.lat, p2.lng);
          const rad = b * Math.PI / 180;
          const weight = i;
          sinSum += Math.sin(rad) * weight;
          cosSum += Math.cos(rad) * weight;
        }
      }

      if (sinSum === 0 && cosSum === 0) return null;
      return (Math.atan2(sinSum, cosSum) * 180 / Math.PI + 360) % 360;
    }

    function onDeviceOrientation(e) {
      if (!appState.isTracking || appState.isPaused) return;

      let compassHeading = null;
      if (e.webkitCompassHeading !== undefined) {
        compassHeading = e.webkitCompassHeading;
      } else if (e.alpha !== null) {
        compassHeading = (360 - e.alpha) % 360;
      }

      if (compassHeading === null || isNaN(compassHeading)) return;

      const now = Date.now();
      const isCompletelyStopped = (!appState.isWalking && (now - appState.lastWalkTimestamp > 5000));

      if (isCompletelyStopped) {
        if (appState.lastCompassHeading !== null) {
          let cDiff = Math.abs(compassHeading - appState.lastCompassHeading);
          if (cDiff > 180) cDiff = 360 - cDiff;
          if (cDiff < 6.0) return;
        }

        appState.lastCompassHeading = compassHeading;
        appState.currentHeading = compassHeading;
        rotateMapSmoothly(compassHeading);
        evaluateSensorCycle();
      }
    }

    function onPositionUpdate(pos) {
      const newPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      appState.currentPos = newPos;

      if (!map) initMap(newPos.lat, newPos.lng);

      const now = Date.now();
      const speed = pos.coords.speed;
      const gpsHeading = pos.coords.heading;

      let determinedHeading = null;

      if (gpsHeading !== null && !isNaN(gpsHeading) && speed !== null && speed >= 1.2) {
        determinedHeading = gpsHeading;
        appState.isWalking = true;
        appState.lastWalkTimestamp = now;
      } else {
        const smoothed = calculateSmoothedHeading(newPos);
        if (smoothed !== null) {
          determinedHeading = smoothed;
          appState.isWalking = true;
          appState.lastWalkTimestamp = now;
        }
      }

      if (determinedHeading !== null) {
        let diffFromCurrent = Math.abs(determinedHeading - appState.currentHeading);
        if (diffFromCurrent > 180) diffFromCurrent = 360 - diffFromCurrent;

        if (diffFromCurrent >= 7.0 || appState.currentHeading === 0) {
          appState.currentHeading = determinedHeading;
          rotateMapSmoothly(determinedHeading);
        }
      } else {
        if (now - appState.lastWalkTimestamp > 5000) {
          appState.isWalking = false;
        }
      }

      if (map) {
        map.setCenter(newPos);
      }

      if (!appState.pinpointTarget) {
        const currentRadius = RADIUS_OPTIONS[radiusIndex];
        const refreshThreshold = Math.max(30, Math.min(300, currentRadius * 0.05));

        if (appState.lastSearchedPos) {
          const movedSinceSearch = getDistance(
            appState.lastSearchedPos.lat, appState.lastSearchedPos.lng,
            newPos.lat, newPos.lng
          );
          if (movedSinceSearch >= refreshThreshold) {
            executeSearch();
          }
        } else {
          executeSearch();
        }
      }

      evaluateSensorCycle();
    }

    function executeSearch() {
      if (!appState.currentPos || isSearchInProgress || appState.pinpointTarget) return;
      isSearchInProgress = true;
      appState.lastSearchedPos = { ...appState.currentPos };
      const currentRadius = RADIUS_OPTIONS[radiusIndex];

      const rText = currentRadius >= 1000 ? `${currentRadius/1000}km` : `${currentRadius}m`;
      const t = I18N[currentLang];
      document.getElementById('target-meta-info').textContent = t.targetMeta(appState.activeKeyword, rText);

      if (placesService) {
        const queryWord = appState.activeKeyword.trim();
        
        const request = {
          location: new google.maps.LatLng(appState.currentPos.lat, appState.currentPos.lng),
          radius: currentRadius,
          query: queryWord
        };

        placesService.textSearch(request, (results, status) => {
          isSearchInProgress = false;
          if (status === google.maps.places.PlacesServiceStatus.OK && results && results.length > 0) {
            const filtered = results.filter(place => {
              const d = getDistance(
                appState.currentPos.lat, appState.currentPos.lng,
                place.geometry.location.lat(), place.geometry.location.lng()
              );
              return d <= currentRadius;
            });

            appState.places = filtered.map(place => ({
              id: place.place_id,
              name: place.name,
              lat: place.geometry.location.lat(),
              lng: place.geometry.location.lng()
            }));
          } else {
            appState.places = [];
            if (status !== google.maps.places.PlacesServiceStatus.ZERO_RESULTS && status !== google.maps.places.PlacesServiceStatus.OK) {
              console.warn("Places API Status:", status);
              document.getElementById('distance-info').innerHTML = `<span style="color:#ff5555;">API Error: ${status}</span>`;
            }
          }
          evaluateSensorCycle();
        });
      } else {
        isSearchInProgress = false;
      }
    }

    // ===================================================
    // 6. UI制御 ＆ クリアボタン
    // ===================================================
    function getRadiusText(r) {
      return r >= 1000 ? `${r/1000}km` : `${r}m`;
    }

    document.getElementById('keyword-input').value = appState.activeKeyword;
    document.getElementById('radius-val').textContent = getRadiusText(RADIUS_OPTIONS[radiusIndex]);

    function setupInputClear(inputEl, clearBtnEl, onClearCallback) {
      function check() {
        if (inputEl.value.trim().length > 0) {
          clearBtnEl.classList.add('show');
        } else {
          clearBtnEl.classList.remove('show');
        }
      }
      inputEl.addEventListener('input', check);
      check();

      clearBtnEl.addEventListener('click', (e) => {
        e.preventDefault();
        inputEl.value = '';
        check();
        inputEl.focus();
        if (onClearCallback) onClearCallback();
      });
    }

    setupInputClear(
      document.getElementById('keyword-input'),
      document.getElementById('btn-input-clear')
    );
    setupInputClear(
      document.getElementById('keyword-filter'),
      document.getElementById('btn-keyword-filter-clear'),
      () => renderKeywordsList()
    );
    setupInputClear(
      document.getElementById('history-filter'),
      document.getElementById('btn-history-filter-clear'),
      () => renderHistoryList()
    );

    document.getElementById('dial-btn').addEventListener('click', () => {
      radiusIndex = (radiusIndex + 1) % RADIUS_OPTIONS.length;
      document.getElementById('radius-val').textContent = getRadiusText(RADIUS_OPTIONS[radiusIndex]);
      localStorage.setItem('sheikah_last_radius_idx', radiusIndex.toString());
    });

    function updateButtonStateUI() {
      const t = I18N[currentLang];
      const indicator = document.getElementById('status-indicator');
      const pauseBtn = document.getElementById('pause-toggle-btn');
      const svgSensor = document.getElementById('svg-sensor');
      const labelSensor = document.getElementById('label-sensor-state');

      if (!appState.isTracking) {
        indicator.textContent = t.standby;
        indicator.className = "status-indicator paused";
        pauseBtn.className = "btn-sheikah btn-pause-toggle paused";
        svgSensor.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        labelSensor.textContent = t.sensorStandby;
      } else if (appState.isPaused) {
        indicator.textContent = t.paused;
        indicator.className = "status-indicator paused";
        pauseBtn.className = "btn-sheikah btn-pause-toggle paused";
        svgSensor.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        labelSensor.textContent = t.sensorPaused;
      } else {
        indicator.textContent = t.searching;
        indicator.className = "status-indicator active";
        pauseBtn.className = "btn-sheikah btn-pause-toggle";
        svgSensor.innerHTML = '<path d="M8 5v14l11-7z"/>';
        labelSensor.textContent = t.sensorActive;
      }

      const muteBtn = document.getElementById('mute-toggle-btn');
      const svgSound = document.getElementById('svg-sound');
      const labelSound = document.getElementById('label-sound-state');
      if (appState.isMuted) {
        muteBtn.className = "btn-sheikah btn-sub-control";
        svgSound.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
        labelSound.textContent = t.soundOff;
      } else {
        muteBtn.className = "btn-sheikah btn-sub-control active";
        svgSound.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
        labelSound.textContent = t.soundOn;
      }

      const wakeBtn = document.getElementById('wakelock-toggle-btn');
      const svgWake = document.getElementById('svg-wake');
      const labelWake = document.getElementById('label-wake-state');
      if (appState.wakeLockActive) {
        wakeBtn.className = "btn-sheikah btn-sub-control active";
        svgWake.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/>';
        labelWake.textContent = t.wakeLockOn;
      } else {
        wakeBtn.className = "btn-sheikah btn-sub-control";
        svgWake.innerHTML = '<path d="M12.3 2a10 10 0 0 0-1.9 19.8 10 10 0 0 0 11.4-11.4A10 10 0 0 0 12.3 2z"/>';
        labelWake.textContent = t.wakeLockOff;
      }
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator && appState.wakeLockActive) {
        try {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
        } catch (err) {}
      }
    }

    function releaseWakeLock() {
      if (wakeLockSentinel !== null) {
        wakeLockSentinel.release();
        wakeLockSentinel = null;
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (wakeLockSentinel !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    document.getElementById('wakelock-toggle-btn').addEventListener('click', async () => {
      appState.wakeLockActive = !appState.wakeLockActive;
      if (appState.wakeLockActive) {
        await requestWakeLock();
      } else {
        releaseWakeLock();
      }
      updateButtonStateUI();
    });

    document.getElementById('mute-toggle-btn').addEventListener('click', () => {
      appState.isMuted = !appState.isMuted;
      if (!appState.isMuted) {
        initAudio();
        playBeep(2000, 0.08);
      }
      updateButtonStateUI();
    });

    async function startSearchFromSet() {
      initAudio();
      playBeep(2200);
      if (appState.wakeLockActive) requestWakeLock();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission === 'granted' && !compassActive) {
            window.addEventListener('deviceorientation', onDeviceOrientation, true);
            compassActive = true;
          }
        } catch (e) {}
      } else if (!compassActive) {
        window.addEventListener('deviceorientation', onDeviceOrientation, true);
        compassActive = true;
      }

      const inputVal = document.getElementById('keyword-input').value.trim();
      appState.activeKeyword = inputVal || "マクドナルド";
      appState.pinpointTarget = null;
      appState.isTracking = true;
      appState.isPaused = false;

      localStorage.setItem('sheikah_last_keyword', appState.activeKeyword);
      localStorage.setItem('sheikah_last_radius_idx', radiusIndex.toString());

      const db = loadSavedData();
      const now = new Date().toISOString();
      if (!db.keywordHistory[appState.activeKeyword]) {
        db.keywordHistory[appState.activeKeyword] = { lastSearch: now, lastArrival: null };
      } else {
        db.keywordHistory[appState.activeKeyword].lastSearch = now;
      }
      saveAppData(db);

      updateButtonStateUI();

      if (!watchId && 'geolocation' in navigator) {
        watchId = navigator.geolocation.watchPosition(onPositionUpdate, (err) => {
          document.getElementById('distance-info').textContent = "GPS Error: " + err.message;
        }, { 
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        });
      } else {
        executeSearch();
      }
    }

    document.getElementById('set-btn').addEventListener('click', startSearchFromSet);
    document.getElementById('keyword-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') startSearchFromSet();
    });

    document.getElementById('pause-toggle-btn').addEventListener('click', () => {
      initAudio();
      if (!appState.isTracking) {
        startSearchFromSet();
        return;
      }

      appState.isPaused = !appState.isPaused;
      if (appState.isPaused) {
        if (radarTimer) { clearTimeout(radarTimer); radarTimer = null; }
        scheduledInterval = null;
      }
      updateButtonStateUI();
      evaluateSensorCycle();
    });

    const pageKeywords = document.getElementById('page-keywords');
    const pageHistory = document.getElementById('page-history');
    const pageSpotDetail = document.getElementById('page-spot-detail');

    function navigateToMain() {
      pageSpotDetail.classList.remove('open');
      pageHistory.classList.remove('open');
      pageKeywords.classList.remove('open');
      evaluateSensorCycle();
    }

    document.getElementById('home-from-keywords').addEventListener('click', navigateToMain);
    document.getElementById('home-from-history').addEventListener('click', navigateToMain);
    document.getElementById('home-from-detail').addEventListener('click', navigateToMain);

    document.getElementById('open-keywords-btn').addEventListener('click', () => {
      renderKeywordsList();
      pageKeywords.classList.add('open');
    });

    document.getElementById('back-to-main').addEventListener('click', () => {
      pageKeywords.classList.remove('open');
      evaluateSensorCycle();
    });

    document.getElementById('back-to-keywords').addEventListener('click', () => {
      pageHistory.classList.remove('open');
      renderKeywordsList();
    });

    document.getElementById('back-to-history-list').addEventListener('click', () => {
      pageSpotDetail.classList.remove('open');
      renderHistoryList();
    });

    function setupSwipeBack(el, backCallback) {
      let startX = 0;
      el.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
      el.addEventListener('touchend', (e) => {
        const diffX = e.changedTouches[0].clientX - startX;
        if (diffX > 80) backCallback();
      }, { passive: true });
    }
    setupSwipeBack(pageKeywords, () => document.getElementById('back-to-main').click());
    setupSwipeBack(pageHistory, () => document.getElementById('back-to-keywords').click());
    setupSwipeBack(pageSpotDetail, () => document.getElementById('back-to-history-list').click());

    // ===================================================
    // 7. リスト表示・ソート・詳細画面・写真＆固定ミニマップ
    // ===================================================
    function renderKeywordsList() {
      const db = loadSavedData();
      const container = document.getElementById('keywords-list-container');
      container.innerHTML = '';
      const t = I18N[currentLang];

      const filterText = document.getElementById('keyword-filter').value.toLowerCase();
      const sortType = document.getElementById('sort-keywords').value;

      let keys = Object.keys(db.keywordHistory).filter(k => k.toLowerCase().includes(filterText));

      keys.sort((a, b) => {
        const dataA = db.keywordHistory[a];
        const dataB = db.keywordHistory[b];
        const countA = db.arrivals.filter(item => item.keyword === a).length;
        const countB = db.arrivals.filter(item => item.keyword === b).length;

        if (sortType === 'recent_search') {
          return new Date(dataB.lastSearch || 0) - new Date(dataA.lastSearch || 0);
        } else if (sortType === 'recent_arrival') {
          return new Date(dataB.lastArrival || 0) - new Date(dataA.lastArrival || 0);
        } else if (sortType === 'count_desc') {
          return countB - countA;
        }
      });

      keys.forEach(k => {
        const count = db.arrivals.filter(item => item.keyword === k).length;
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div class="list-item-row">
            <div class="list-item-left">
              <span class="list-item-title">${k}</span>
              <div class="list-item-sub">${t.arrivalCount(count)}</div>
            </div>
            <div class="item-right-actions">
              <button class="btn-sheikah-sm btn-reset-search" data-key="${k}">SET</button>
              <div style="color: var(--sheikah-gold); font-size: 1.3rem;">▶</div>
            </div>
          </div>
        `;

        div.addEventListener('click', (e) => {
          if (e.target.classList.contains('btn-reset-search')) return;
          appState.selectedKeywordForHistory = k;
          document.getElementById('history-header-title').textContent = `${k}`;
          document.getElementById('history-filter').value = '';
          document.getElementById('btn-history-filter-clear').classList.remove('show');
          renderHistoryList();
          pageHistory.classList.add('open');
        });

        div.querySelector('.btn-reset-search').addEventListener('click', (e) => {
          e.stopPropagation();
          document.getElementById('keyword-input').value = k;
          document.getElementById('btn-input-clear').classList.add('show');
          pageKeywords.classList.remove('open');
          startSearchFromSet();
        });

        container.appendChild(div);
      });
    }

    document.getElementById('btn-delete-zero-keywords').addEventListener('click', () => {
      const db = loadSavedData();
      const t = I18N[currentLang];
      const zeroKeys = Object.keys(db.keywordHistory).filter(k => {
        const count = db.arrivals.filter(item => item.keyword === k).length;
        return count === 0;
      });

      if (zeroKeys.length === 0) {
        alert(t.noZeroKeywords);
        return;
      }

      if (confirm(t.confirmCleanZero(zeroKeys.length))) {
        zeroKeys.forEach(k => {
          delete db.keywordHistory[k];
        });
        saveAppData(db);
        renderKeywordsList();
      }
    });

    // 到達履歴画面
    function renderHistoryList() {
      const db = loadSavedData();
      const container = document.getElementById('history-list-container');
      container.innerHTML = '';
      const t = I18N[currentLang];

      const filterText = document.getElementById('history-filter').value.toLowerCase();
      const sortType = document.getElementById('sort-history').value;

      let items = db.arrivals.filter(a => 
        a.keyword === appState.selectedKeywordForHistory &&
        a.name.toLowerCase().includes(filterText)
      );

      if (appState.currentPos) {
        items.forEach(item => {
          item.calcDistance = getDistance(appState.currentPos.lat, appState.currentPos.lng, item.lat, item.lng);
        });
      }

      items.sort((a, b) => {
        if (sortType === 'near_asc') {
          return (a.calcDistance || Infinity) - (b.calcDistance || Infinity);
        } else if (sortType === 'date_desc') {
          return new Date(b.date) - new Date(a.date);
        } else if (sortType === 'date_asc') {
          return new Date(a.date) - new Date(b.date);
        } else if (sortType === 'name_asc') {
          return a.name.localeCompare(b.name, currentLang === 'ja' ? 'ja' : 'en');
        }
      });

      if (items.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; color: #889; padding: 40px 10px; font-size: 0.95rem;">
            ${t.emptyHistory}
          </div>
        `;
      } else {
        items.forEach(item => {
          const d = new Date(item.date);
          const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;

          let distStr = "";
          if (item.calcDistance !== undefined) {
            distStr = item.calcDistance >= 1000 ? `${(item.calcDistance/1000).toFixed(1)}km` : `${Math.round(item.calcDistance)}m`;
          }

          const div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = `
            <div class="list-item-left">
              <span class="list-item-title">${item.name}</span>
              <div class="list-item-sub">${t.arrivalDate(dateStr, distStr)}</div>
            </div>
            <div class="action-button-row">
              <button class="btn-sheikah-sm btn-pinpoint-set">SET</button>
              <button class="btn-sheikah-sm btn-toggle-radar ${item.muted ? 'off' : 'active'}">
                ${item.muted ? t.radarOff : t.radarOn}
              </button>
              <button class="btn-sheikah-sm btn-copy-sm">${t.copyBtn}</button>
            </div>
          `;

          div.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            openSpotDetailModal(item);
          });

          div.querySelector('.btn-pinpoint-set').addEventListener('click', (e) => {
            e.stopPropagation();
            setPinpointTargetAndStart(item);
          });

          div.querySelector('.btn-toggle-radar').addEventListener('click', (e) => {
            e.stopPropagation();
            item.muted = !item.muted;
            saveAppData(db);
            renderHistoryList();
          });

          div.querySelector('.btn-copy-sm').addEventListener('click', async (e) => {
            e.stopPropagation();
            copyPlaceNameToClipboard(item.name);
          });

          container.appendChild(div);
        });
      }
    }

    function copyPlaceNameToClipboard(text) {
      const t = I18N[currentLang];
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(t.toastCopied(text));
        }).catch(() => prompt("Copy:", text));
      } else {
        prompt("Copy:", text);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast-banner');
      document.getElementById('toast-text').textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function setPinpointTargetAndStart(item) {
      const t = I18N[currentLang];
      appState.pinpointTarget = {
        id: item.id,
        name: item.name,
        lat: item.lat,
        lng: item.lng
      };
      appState.activeKeyword = item.name;
      document.getElementById('keyword-input').value = item.name;
      document.getElementById('btn-input-clear').classList.add('show');
      document.getElementById('target-meta-info').textContent = t.targetMetaPinpoint(item.name);

      pageSpotDetail.classList.remove('open');
      pageHistory.classList.remove('open');
      pageKeywords.classList.remove('open');

      appState.isTracking = true;
      appState.isPaused = false;
      updateButtonStateUI();
      evaluateSensorCycle();
    }

    // 第4画面：Googleマップ詳細・写真・完全固定ミニマップ
    function openSpotDetailModal(item) {
      appState.selectedSpotForDetail = item;
      const t = I18N[currentLang];
      const db = loadSavedData();

      document.getElementById('detail-spot-name').textContent = item.name;
      document.getElementById('detail-spot-address').textContent = t.loadingAddress;
      const photosBox = document.getElementById('detail-photos-container');
      photosBox.innerHTML = `<div class="no-photos-box">${t.loadingPhotos}</div>`;

      // 第4画面アクションボタンの同期
      document.getElementById('detail-btn-pinpoint-set').onclick = () => setPinpointTargetAndStart(item);
      document.getElementById('detail-btn-copy').onclick = () => copyPlaceNameToClipboard(item.name);

      // 第4画面 レーダーON/OFFボタン
      const radarBtn = document.getElementById('detail-btn-toggle-radar');
      function updateDetailRadarBtn() {
        if (item.muted) {
          radarBtn.textContent = t.radarOff;
          radarBtn.className = "btn-sheikah-sm off";
        } else {
          radarBtn.textContent = t.radarOn;
          radarBtn.className = "btn-sheikah-sm active";
        }
      }
      updateDetailRadarBtn();

      radarBtn.onclick = () => {
        item.muted = !item.muted;
        saveAppData(db);
        updateDetailRadarBtn();
      };

      // 第4画面 個別削除ボタン
      document.getElementById('detail-btn-delete-single').onclick = () => {
        if (confirm(t.confirmDeleteSingle(item.name))) {
          db.arrivals = db.arrivals.filter(a => a.id !== item.id);
          saveAppData(db);
          pageSpotDetail.classList.remove('open');
          renderHistoryList();
        }
      };

      pageSpotDetail.classList.add('open');

      const gallery = document.createElement('div');
      gallery.className = 'photo-gallery-scroll';

      // 1枚目：操作完全固定のシーカーミニマップ
      const mapWrap = document.createElement('div');
      mapWrap.className = 'gallery-minimap-wrap';
      mapWrap.innerHTML = `
        <div id="detail-minimap"></div>
        <div class="minimap-badge">${t.minimapBadge}</div>
      `;
      gallery.appendChild(mapWrap);

      if (placesService && item.id) {
        placesService.getDetails({
          placeId: item.id,
          fields: ['name', 'formatted_address', 'photos']
        }, (place, status) => {
          if (status === google.maps.places.PlacesServiceStatus.OK && place) {
            document.getElementById('detail-spot-address').textContent = place.formatted_address || t.noAddress;
            if (place.photos && place.photos.length > 0) {
              place.photos.forEach(photo => {
                const url = photo.getUrl({ maxWidth: 800, maxHeight: 600 });
                const wrap = document.createElement('div');
                wrap.className = 'gallery-img-wrap';
                wrap.innerHTML = `<img src="${url}" alt="${item.name}" loading="lazy">`;
                gallery.appendChild(wrap);
              });
            }
          } else {
            document.getElementById('detail-spot-address').textContent = t.noAddress;
          }

          photosBox.innerHTML = '';
          photosBox.appendChild(gallery);

          // ミニマップを完全固定（指2本スクロール・探索無効化）で描画
          setTimeout(() => {
            detailMinimapInstance = new google.maps.Map(document.getElementById('detail-minimap'), {
              center: { lat: item.lat, lng: item.lng },
              zoom: 17,
              disableDefaultUI: true,
              styles: currentMapStyleMode === 'high' ? mapStyleHighContrast : mapStyleNormal,
              gestureHandling: 'none',   // 操作・スクロール完全無効
              draggable: false,          // ドラッグ不可
              scrollwheel: false,
              disableDoubleClickZoom: true
            });

            new google.maps.Marker({
              position: { lat: item.lat, lng: item.lng },
              map: detailMinimapInstance,
              title: item.name,
              icon: {
                path: google.maps.SymbolPath.CIRCLE,
                scale: 9,
                fillColor: "#00f3ff",
                fillOpacity: 1,
                strokeWeight: 2,
                strokeColor: "#ffffff"
              }
            });
          }, 100);
        });
      } else {
        photosBox.innerHTML = '';
        photosBox.appendChild(gallery);
      }
    }

    // 第3画面：キーワード全体の履歴を一括削除
    document.getElementById('btn-delete-current-keyword').addEventListener('click', () => {
      const targetKey = appState.selectedKeywordForHistory;
      if (!targetKey) return;
      const t = I18N[currentLang];

      if (confirm(t.confirmDeleteKeyword(targetKey))) {
        const db = loadSavedData();
        if (db.keywordHistory[targetKey]) {
          delete db.keywordHistory[targetKey];
        }
        db.arrivals = db.arrivals.filter(item => item.keyword !== targetKey);
        saveAppData(db);

        pageHistory.classList.remove('open');
        renderKeywordsList();
      }
    });

    document.getElementById('keyword-filter').addEventListener('input', renderKeywordsList);
    document.getElementById('sort-keywords').addEventListener('change', renderKeywordsList);
    document.getElementById('history-filter').addEventListener('input', renderHistoryList);
    document.getElementById('sort-history').addEventListener('change', renderHistoryList);

    applyLanguage(currentLang);
  </script>
</body>
</html>
