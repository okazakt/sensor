<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SHEIKAH SLATE SENSOR</title>
  <style>
    :root {
      --sheikah-cyan: #00f3ff;
      --sheikah-cyan-glow: rgba(0, 243, 255, 0.7);
      --sheikah-orange: #ff9d00;
      --sheikah-orange-glow: rgba(255, 157, 0, 0.8);
      --sheikah-gold: #c5a059;
      --sheikah-gold-dark: #6e5426;
      --sheikah-bg: #111417;
      --sheikah-panel: #1b2228;
      --sheikah-border: #3b3226;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
    }

    body {
      background-color: #080a0d;
      color: #e0f8ff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: var(--sheikah-bg);
      border-left: 2px solid var(--sheikah-border);
      border-right: 2px solid var(--sheikah-border);
      display: flex;
      flex-direction: column;
    }

    /* ===================================================
       上部：正円マップ（インカメラ回避）
    =================================================== */
    .top-section {
      width: 100%;
      height: 52vh;
      position: relative;
      background: radial-gradient(circle at center, #262c33 0%, #111417 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 3px solid var(--sheikah-gold);
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      overflow: hidden;
      padding-top: max(env(safe-area-inset-top), 32px);
    }

    .relic-circuit {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.35;
      background: 
        radial-gradient(circle at 10% 15%, var(--sheikah-orange) 2px, transparent 3px),
        radial-gradient(circle at 90% 85%, var(--sheikah-cyan) 2px, transparent 3px);
    }

    /* 正円外枠（音無しでも反応度が分かるシーカーリング発光） */
    .circle-map-wrapper {
      position: relative;
      width: min(86vw, 330px);
      height: min(86vw, 330px);
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, var(--sheikah-gold) 0%, var(--sheikah-gold-dark) 50%, var(--sheikah-gold) 100%);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 10px #000;
      margin-top: 8px;
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
    }

    /* レーダー反応度別の円周ビジュアルスタイル */
    .circle-map-wrapper.signal-idle {
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 10px #000;
      animation: none;
    }
    .circle-map-wrapper.signal-level1 {
      box-shadow: 0 0 25px var(--sheikah-cyan-glow), inset 0 0 12px var(--sheikah-cyan);
      animation: ring-pulse-slow 2.5s infinite ease-in-out;
    }
    .circle-map-wrapper.signal-level2 {
      box-shadow: 0 0 35px var(--sheikah-cyan), inset 0 0 16px #fff;
      animation: ring-pulse-medium 1.4s infinite ease-in-out;
    }
    .circle-map-wrapper.signal-level3 {
      box-shadow: 0 0 45px var(--sheikah-orange-glow), 0 0 20px var(--sheikah-cyan), inset 0 0 20px #fff;
      animation: ring-pulse-fast 0.6s infinite ease-in-out;
    }

    @keyframes ring-pulse-slow {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.015); filter: brightness(1.25); }
    }
    @keyframes ring-pulse-medium {
      0%, 100% { transform: scale(1); filter: brightness(1.1); }
      50% { transform: scale(1.025); filter: brightness(1.4); }
    }
    @keyframes ring-pulse-fast {
      0%, 100% { transform: scale(1); filter: brightness(1.2); }
      50% { transform: scale(1.035); filter: brightness(1.6); }
    }

    #map-container {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: #03080e;
    }

    #map {
      width: 100%;
      height: 100%;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: center center;
    }

    .gm-style-cc, .gmnoprint, a[href^="https://maps.google.com/maps"] {
      display: none !important;
    }

    .player-pointer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      border-left: 11px solid transparent;
      border-right: 11px solid transparent;
      border-bottom: 22px solid var(--sheikah-cyan);
      filter: drop-shadow(0 0 10px var(--sheikah-cyan));
      pointer-events: none;
      z-index: 5;
    }

    .radar-pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid var(--sheikah-cyan);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
    }

    .pulse-anim {
      animation: pulse-out-anim 0.65s ease-out forwards;
    }

    @keyframes pulse-out-anim {
      0% { width: 30px; height: 30px; opacity: 1; border-color: #fff; }
      100% { width: 340px; height: 340px; opacity: 0; border-color: var(--sheikah-cyan); }
    }

    /* 下部：操作パネル */
    .bottom-section {
      width: 100%;
      height: 48vh;
      background: var(--sheikah-panel);
      padding: 12px 16px 10px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border-top: 1px solid rgba(197, 160, 89, 0.3);
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .keyword-input-wrap {
      flex: 1;
      position: relative;
    }

    .keyword-input-wrap input {
      width: 100%;
      background: rgba(3, 8, 14, 0.9);
      border: 1.5px solid var(--sheikah-gold);
      color: var(--sheikah-cyan);
      padding: 10px 12px;
      font-size: 1rem;
      border-radius: 6px;
      outline: none;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    }
    .keyword-input-wrap input:focus {
      border-color: var(--sheikah-cyan);
      box-shadow: 0 0 10px var(--sheikah-cyan-glow);
    }

    .dial-lock {
      width: 72px;
      height: 46px;
      background: linear-gradient(180deg, #111 0%, #2f271a 50%, #111 100%);
      border: 1.5px solid var(--sheikah-gold);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    .dial-label {
      font-size: 0.6rem;
      color: var(--sheikah-orange);
      letter-spacing: 1px;
    }
    .dial-value {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--sheikah-cyan);
    }

    .btn-set {
      height: 46px;
      padding: 0 16px;
      background: rgba(0, 243, 255, 0.15);
      border: 1.5px solid var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }
    .btn-set:active {
      background: var(--sheikah-cyan);
      color: #000;
    }

    .status-panel {
      background: rgba(3, 8, 14, 0.65);
      border: 1px solid #334;
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .target-meta-info {
      font-size: 0.8rem;
      color: var(--sheikah-cyan);
      margin-bottom: 2px;
      opacity: 0.95;
    }

    .unknown-badge {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .unknown-count {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--sheikah-orange);
      text-shadow: 0 0 8px var(--sheikah-orange);
    }

    .search-status-badge {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      max-width: 55%;
    }

    .status-indicator {
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .status-indicator.active {
      color: var(--sheikah-cyan);
      animation: blink-anim 1.5s infinite;
    }
    .status-indicator.paused {
      color: #889;
    }

    @keyframes blink-anim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-sheikah {
      background: rgba(197, 160, 89, 0.1);
      border: 1.5px solid var(--sheikah-gold);
      color: var(--sheikah-gold);
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-sheikah:active {
      background: var(--sheikah-gold);
      color: #000;
    }

    .btn-pause-toggle {
      border-color: var(--sheikah-orange);
      color: var(--sheikah-orange);
      box-shadow: 0 0 8px rgba(255, 157, 0, 0.2);
    }
    .btn-pause-toggle.paused {
      border-color: var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .app-version-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: #556270;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* ===================================================
       スライド画面（大幅引き下げ ＆ 操作性アップ）
    =================================================== */
    .slide-page {
      position: absolute;
      top: 0;
      left: 100%;
      width: 100%;
      height: 100%;
      background: var(--sheikah-bg);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -5px 0 25px rgba(0,0,0,0.9);
    }
    .slide-page.open {
      transform: translateX(-100%);
    }

    /* ヘッダー位置を画面上部からしっかり引き下げ */
    .page-header {
      padding-top: calc(max(env(safe-area-inset-top), 48px) + 12px);
      padding-bottom: 14px;
      padding-left: 16px;
      padding-right: 16px;
      background: #151a20;
      border-bottom: 2px solid var(--sheikah-gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 押しやすい大きなピル型戻るボタン */
    .back-btn {
      color: var(--sheikah-cyan);
      background: rgba(0, 243, 255, 0.1);
      border: 1.5px solid var(--sheikah-cyan);
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      padding: 8px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
    }
    .back-btn:active {
      background: var(--sheikah-cyan);
      color: #000;
    }

    .page-title-text {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--sheikah-gold);
      letter-spacing: 1px;
    }

    .filter-bar {
      padding: 12px 16px;
      background: rgba(0,0,0,0.4);
      display: flex;
      gap: 10px;
    }
    .filter-bar input, .filter-bar select {
      background: #111;
      border: 1.5px solid var(--sheikah-border);
      color: #eee;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    .filter-bar select { flex: 1; }

    .list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .list-item {
      background: rgba(27, 34, 40, 0.95);
      border: 1px solid var(--sheikah-border);
      border-left: 5px solid var(--sheikah-gold);
      padding: 14px 16px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-item:active {
      background: rgba(45, 55, 65, 0.95);
    }

    .list-item-title {
      font-weight: bold;
      font-size: 1.15rem;
      color: #fff;
    }
    .list-item-sub {
      font-size: 0.85rem;
      color: #99a;
      margin-top: 4px;
    }

    .toggle-radar {
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 6px;
      border: 1px solid #555;
      cursor: pointer;
    }
    .toggle-radar.active {
      border-color: var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      background: rgba(0, 243, 255, 0.15);
    }
    .toggle-radar.off {
      border-color: #666;
      color: #888;
      background: transparent;
    }

    #toast-banner {
      position: absolute;
      top: calc(max(env(safe-area-inset-top), 32px) + 10px);
      left: 5%;
      width: 90%;
      background: rgba(3, 8, 14, 0.95);
      border: 2px solid var(--sheikah-cyan);
      box-shadow: 0 0 25px var(--sheikah-cyan-glow);
      color: #fff;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      z-index: 200;
      transform: translateY(-200%);
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    #toast-banner.show {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="toast-banner">
      <div style="font-size: 0.75rem; color: var(--sheikah-orange); letter-spacing: 2px;">DISCOVERY COMPLETED</div>
      <div id="toast-text" style="font-size: 1.1rem; font-weight: bold; margin-top: 6px; color: var(--sheikah-cyan);"></div>
    </div>

    <!-- 上部：正円マップ（反応度に応じて円周が光る） -->
    <div class="top-section">
      <div class="relic-circuit"></div>
      <div class="circle-map-wrapper signal-idle" id="circle-map-wrapper">
        <div id="map-container">
          <div id="map"></div>
          <div class="player-pointer"></div>
          <div class="radar-pulse-ring" id="radar-pulse"></div>
        </div>
      </div>
    </div>

    <!-- 下部：操作パネル -->
    <div class="bottom-section">
      <div class="input-row">
        <div class="keyword-input-wrap">
          <input type="text" id="keyword-input" value="マクドナルド" placeholder="探す対象を入力...">
        </div>
        <div class="dial-lock" id="dial-btn">
          <div class="dial-label">RADIUS</div>
          <div class="dial-value" id="radius-val">3km</div>
        </div>
        <button class="btn-set" id="set-btn">SET</button>
      </div>

      <div class="status-panel">
        <div>
          <div class="target-meta-info" id="target-meta-info">[対象: マクドナルド / 範囲: 3km]</div>
          <div class="unknown-badge">
            <span style="font-size: 0.8rem; color: #889;">未踏:</span>
            <span class="unknown-count" id="unknown-count">0</span>
            <span style="font-size: 0.85rem; color: #bbb;">件探知中</span>
          </div>
        </div>
        <div class="search-status-badge">
          <div class="status-indicator paused" id="status-indicator">STANDBY</div>
          <div id="distance-info" style="font-size: 0.8rem; color: var(--sheikah-cyan); word-break: break-all;">
            --
          </div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-sheikah btn-pause-toggle" id="pause-toggle-btn">PAUSE SENSOR</button>
        <button class="btn-sheikah" id="open-keywords-btn">到達済みリスト (図鑑)</button>
      </div>

      <div class="app-version-footer">
        <span style="color: #c5a059;">※消音時も円周の光と振動で反応</span>
        <span>VER: <span id="app-build-ver">v0.26.091.252218</span></span>
      </div>
    </div>

    <!-- 第2画面：キーワード履歴 -->
    <div class="slide-page" id="page-keywords">
      <div class="page-header">
        <button class="back-btn" id="back-to-main">◀ メイン</button>
        <div class="page-title-text">キーワード履歴</div>
        <div style="width: 70px;"></div>
      </div>
      <div class="filter-bar">
        <input type="text" id="keyword-filter" placeholder="キーワード絞り込み..." style="flex: 1;">
        <select id="sort-keywords">
          <option value="recent_search">検索日時順</option>
          <option value="recent_arrival">到達日時順</option>
          <option value="count_desc">到達件数降順</option>
        </select>
      </div>
      <div class="list-scroll" id="keywords-list-container"></div>
    </div>

    <!-- 第3画面：到達場所履歴 -->
    <div class="slide-page" id="page-history">
      <div class="page-header">
        <button class="back-btn" id="back-to-keywords">◀ 履歴一覧</button>
        <div class="page-title-text" id="history-header-title" style="color: var(--sheikah-cyan);">到達履歴</div>
        <div style="width: 70px;"></div>
      </div>
      <div class="filter-bar">
        <select id="sort-history">
          <option value="date_desc">到達日時が新しい順</option>
          <option value="date_asc">到達日時が古い順</option>
          <option value="name_asc">名称あいうえお順</option>
        </select>
      </div>
      <div class="list-scroll" id="history-list-container"></div>
    </div>
  </div>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDF5voeGaCH5nEHwQyeYC1wV1ccTyEsOAc&libraries=places"></script>

  <script>
    // ===================================================
    // 1. Web Audio API 音源 ＆ バイブレーション
    // ===================================================
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      try {
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);
      } catch (e) {}
    }

    window.addEventListener('touchstart', () => { initAudio(); }, { once: true });
    window.addEventListener('click', () => { initAudio(); }, { once: true });

    function playBeep(freq = 1800) {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.05, audioCtx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch (e) {}
    }

    function playTreasureFanfare() {
      // 【新機能】到達時のバイブレーション（宝箱リズム）
      if ('vibrate' in navigator) {
        navigator.vibrate([200, 100, 300, 100, 600]);
      }

      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50, 1174.66, 1318.51];
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

          const dur = (idx === notes.length - 1) ? 1.5 : 0.18;
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        }, idx * 115);
      });
    }

    // ===================================================
    // 2. 状態管理
    // ===================================================
    const RADIUS_OPTIONS = [100, 1000, 3000, 10000, 50000, 100000];
    let radiusIndex = 2; // 3km

    let appState = {
      isTracking: false,
      isPaused: false,
      currentPos: null,
      prevPos: null,
      lastSearchedPos: null,
      currentHeading: 0,
      visualMapRotation: 0,
      isWalking: false,
      lastMoveTimestamp: 0,
      activeKeyword: "マクドナルド",
      selectedKeywordForHistory: null,
      places: []
    };

    let watchId = null;
    let compassActive = false;
    let placesService = null;
    let isSearchInProgress = false;

    function loadSavedData() {
      const data = localStorage.getItem('sheikah_db_v1');
      if (data) return JSON.parse(data);
      return { keywordHistory: {}, arrivals: [] };
    }

    function saveAppData(db) {
      localStorage.setItem('sheikah_db_v1', JSON.stringify(db));
    }

    // ===================================================
    // 3. Google Maps（文字・アイコン完全非表示）
    // ===================================================
    let map = null;

    const sheikahMapStyle = [
      { featureType: "all", elementType: "labels", stylers: [{ visibility: "off" }] },
      { featureType: "all", elementType: "labels.text", stylers: [{ visibility: "off" }] },
      { featureType: "all", elementType: "labels.icon", stylers: [{ visibility: "off" }] },
      { featureType: "poi", stylers: [{ visibility: "off" }] },
      { featureType: "administrative", stylers: [{ visibility: "off" }] },
      { featureType: "transit", stylers: [{ visibility: "off" }] },
      { featureType: "road", elementType: "labels", stylers: [{ visibility: "off" }] },
      { elementType: "geometry", stylers: [{ color: "#081018" }] },
      { featureType: "road", elementType: "geometry", stylers: [{ color: "#142433" }] },
      { featureType: "water", elementType: "geometry", stylers: [{ color: "#02070d" }] }
    ];

    function initMap(lat, lng) {
      if (typeof google === 'undefined' || !google.maps) return;
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat, lng },
        zoom: 17,
        disableDefaultUI: true,
        styles: sheikahMapStyle,
        gestureHandling: 'none'
      });
      placesService = new google.maps.places.PlacesService(map);
    }

    // ===================================================
    // 4. 幾何計算 ＆ センサーロジック（円周ビジュアル連動）
    // ===================================================
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    let radarTimer = null;
    let currentScheduledInterval = null;
    let lastEvaluatedDistance = null;

    // 【新機能】円周リングのビジュアル切り替え
    function updateVisualRing(level) {
      const ring = document.getElementById('circle-map-wrapper');
      if (!ring) return;
      ring.className = `circle-map-wrapper signal-${level}`;
    }

    function evaluateSensorCycle() {
      if (!appState.isTracking || appState.isPaused || !appState.currentPos) {
        if (radarTimer) { clearTimeout(radarTimer); radarTimer = null; }
        updateVisualRing('idle');
        return;
      }

      const db = loadSavedData();
      const activeTargets = appState.places.filter(p => {
        const item = db.arrivals.find(a => a.id === p.id);
        return !item || !item.muted;
      });

      document.getElementById('unknown-count').textContent = activeTargets.length;

      if (activeTargets.length === 0) {
        if (!document.getElementById('distance-info').textContent.includes("APIエラー")) {
          document.getElementById('distance-info').textContent = "範囲内に対象なし";
        }
        if (radarTimer) { clearTimeout(radarTimer); radarTimer = null; currentScheduledInterval = null; }
        updateVisualRing('idle');
        return;
      }

      let closestTarget = null;
      let minDistance = Infinity;
      let targetBearingDiff = 0;

      activeTargets.forEach(t => {
        const d = getDistance(appState.currentPos.lat, appState.currentPos.lng, t.lat, t.lng);
        if (d < minDistance) {
          minDistance = d;
          closestTarget = t;
          const bearing = getBearing(appState.currentPos.lat, appState.currentPos.lng, t.lat, t.lng);
          let diff = Math.abs(appState.currentHeading - bearing);
          if (diff > 180) diff = 360 - diff;
          targetBearingDiff = diff;
        }
      });

      if (!document.getElementById('distance-info').textContent.includes("APIエラー")) {
        document.getElementById('distance-info').textContent = "探知反応あり";
      }

      // 到着判定（20m以内）
      if (minDistance <= 20) {
        handleArrival(closestTarget);
        return;
      }

      const isApproaching = (lastEvaluatedDistance === null || minDistance < lastEvaluatedDistance);
      lastEvaluatedDistance = minDistance;

      let interval = null;
      // 反応レベルの判定（音 ＋ 円周のビジュアル発光）
      if (minDistance <= 200) {
        if (targetBearingDiff <= 35) {
          interval = 600; // 正面・至近（高周期）
          updateVisualRing('level3'); // 超連射級の強烈発光
        } else if (isApproaching) {
          interval = 1400; // 接近中（中周期）
          updateVisualRing('level2'); // 明るいシアンパルス
        } else {
          interval = 2200;
          updateVisualRing('level1');
        }
      } else {
        interval = 2500; // 遠距離
        updateVisualRing('level1'); // 静かなシアン呼吸
      }

      if (interval !== null) {
        scheduleRadarSound(interval);
      } else {
        if (radarTimer) { clearTimeout(radarTimer); radarTimer = null; currentScheduledInterval = null; }
        updateVisualRing('idle');
      }
    }

    function scheduleRadarSound(interval) {
      if (radarTimer && currentScheduledInterval === interval) {
        return;
      }

      if (radarTimer) clearTimeout(radarTimer);
      currentScheduledInterval = interval;

      function pulse() {
        if (!appState.isTracking || appState.isPaused) {
          radarTimer = null;
          return;
        }
        playBeep(interval <= 700 ? 2100 : 1750);

        const wave = document.getElementById('radar-pulse');
        wave.classList.remove('pulse-anim');
        void wave.offsetWidth;
        wave.classList.add('pulse-anim');

        radarTimer = setTimeout(pulse, interval);
      }
      pulse();
    }

    function handleArrival(target) {
      playTreasureFanfare();

      const db = loadSavedData();
      const now = new Date().toISOString();
      const existing = db.arrivals.find(a => a.id === target.id);
      if (!existing) {
        db.arrivals.push({
          id: target.id,
          name: target.name,
          keyword: appState.activeKeyword,
          lat: target.lat,
          lng: target.lng,
          date: now,
          muted: true
        });
      }
      if (!db.keywordHistory[appState.activeKeyword]) {
        db.keywordHistory[appState.activeKeyword] = { lastSearch: now, lastArrival: now };
      } else {
        db.keywordHistory[appState.activeKeyword].lastArrival = now;
      }
      saveAppData(db);

      if (map) {
        new google.maps.Marker({
          position: { lat: target.lat, lng: target.lng },
          map: map,
          title: target.name,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: "#00f3ff",
            fillOpacity: 1,
            strokeWeight: 2,
            strokeColor: "#ffffff"
          }
        });
      }

      const toast = document.getElementById('toast-banner');
      document.getElementById('toast-text').textContent = `マップに「${target.name}」が記録されました`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 5000);

      lastEvaluatedDistance = null;
      setTimeout(() => {
        evaluateSensorCycle();
      }, 1500);
    }

    // ===================================================
    // 5. ハイブリッド方向追従 ＆ 移動に伴う動的再検索
    // ===================================================
    function rotateMapSmoothly(targetBearing) {
      const mapDiv = document.getElementById('map');
      if (!mapDiv) return;

      const desiredAngle = -targetBearing;
      let diff = (desiredAngle - appState.visualMapRotation) % 360;
      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;

      appState.visualMapRotation += diff;
      mapDiv.style.transform = `rotate(${appState.visualMapRotation}deg)`;
    }

    function onDeviceOrientation(e) {
      if (!appState.isTracking || appState.isPaused) return;

      let compassHeading = null;
      if (e.webkitCompassHeading !== undefined) {
        compassHeading = e.webkitCompassHeading;
      } else if (e.alpha !== null) {
        compassHeading = (360 - e.alpha) % 360;
      }

      if (compassHeading === null || isNaN(compassHeading)) return;

      const now = Date.now();
      if (!appState.isWalking || (now - appState.lastMoveTimestamp > 2500)) {
        appState.currentHeading = compassHeading;
        rotateMapSmoothly(compassHeading);
        evaluateSensorCycle();
      }
    }

    function onPositionUpdate(pos) {
      const newPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      appState.currentPos = newPos;

      if (!map) initMap(newPos.lat, newPos.lng);

      const hasGpsHeading = (pos.coords.heading !== null && !isNaN(pos.coords.heading) && pos.coords.speed > 0.6);

      if (hasGpsHeading) {
        appState.isWalking = true;
        appState.lastMoveTimestamp = Date.now();
        appState.currentHeading = pos.coords.heading;
        appState.prevPos = newPos;
        rotateMapSmoothly(appState.currentHeading);
      } else if (appState.prevPos) {
        const moved = getDistance(appState.prevPos.lat, appState.prevPos.lng, newPos.lat, newPos.lng);
        if (moved >= 2.5) {
          appState.isWalking = true;
          appState.lastMoveTimestamp = Date.now();
          appState.currentHeading = getBearing(appState.prevPos.lat, appState.prevPos.lng, newPos.lat, newPos.lng);
          appState.prevPos = newPos;
          rotateMapSmoothly(appState.currentHeading);
        }
      } else {
        appState.prevPos = newPos;
      }

      if (map) {
        map.setCenter(newPos);
      }

      const currentRadius = RADIUS_OPTIONS[radiusIndex];
      const refreshThreshold = Math.max(30, Math.min(300, currentRadius * 0.05));

      if (appState.lastSearchedPos) {
        const movedSinceSearch = getDistance(
          appState.lastSearchedPos.lat, appState.lastSearchedPos.lng,
          newPos.lat, newPos.lng
        );
        if (movedSinceSearch >= refreshThreshold) {
          executeSearch();
        }
      } else {
        executeSearch();
      }

      evaluateSensorCycle();
    }

    function executeSearch() {
      if (!appState.currentPos || isSearchInProgress) return;
      isSearchInProgress = true;
      appState.lastSearchedPos = { ...appState.currentPos };
      const currentRadius = RADIUS_OPTIONS[radiusIndex];

      const rText = currentRadius >= 1000 ? `${currentRadius/1000}km` : `${currentRadius}m`;
      document.getElementById('target-meta-info').textContent = `[対象: ${appState.activeKeyword} / 範囲: ${rText}]`;

      if (placesService) {
        const queryWord = appState.activeKeyword.trim();
        
        const request = {
          location: new google.maps.LatLng(appState.currentPos.lat, appState.currentPos.lng),
          radius: currentRadius,
          query: queryWord
        };

        placesService.textSearch(request, (results, status) => {
          isSearchInProgress = false;
          if (status === google.maps.places.PlacesServiceStatus.OK && results && results.length > 0) {
            const filtered = results.filter(place => {
              const d = getDistance(
                appState.currentPos.lat, appState.currentPos.lng,
                place.geometry.location.lat(), place.geometry.location.lng()
              );
              return d <= currentRadius;
            });

            appState.places = filtered.map(place => ({
              id: place.place_id,
              name: place.name,
              lat: place.geometry.location.lat(),
              lng: place.geometry.location.lng()
            }));
          } else {
            appState.places = [];
            if (status !== google.maps.places.PlacesServiceStatus.ZERO_RESULTS && status !== google.maps.places.PlacesServiceStatus.OK) {
              console.warn("Places API Status:", status);
              document.getElementById('distance-info').innerHTML = `<span style="color:#ff5555;">APIエラー: ${status}</span>`;
            }
          }
          evaluateSensorCycle();
        });
      } else {
        isSearchInProgress = false;
      }
    }

    // ===================================================
    // 6. UI制御
    // ===================================================
    function getRadiusText(r) {
      return r >= 1000 ? `${r/1000}km` : `${r}m`;
    }

    document.getElementById('dial-btn').addEventListener('click', () => {
      radiusIndex = (radiusIndex + 1) % RADIUS_OPTIONS.length;
      document.getElementById('radius-val').textContent = getRadiusText(RADIUS_OPTIONS[radiusIndex]);
    });

    function updateSearchStatusUI(active) {
      const indicator = document.getElementById('status-indicator');
      const pauseBtn = document.getElementById('pause-toggle-btn');

      if (active) {
        indicator.textContent = "SEARCHING...";
        indicator.className = "status-indicator active";
        pauseBtn.textContent = "PAUSE SENSOR";
        pauseBtn.className = "btn-sheikah btn-pause-toggle";
      } else {
        indicator.textContent = "PAUSED";
        indicator.className = "status-indicator paused";
        pauseBtn.textContent = "RESUME SENSOR";
        pauseBtn.className = "btn-sheikah btn-pause-toggle paused";
        updateVisualRing('idle');
      }
    }

    async function startSearchFromSet() {
      initAudio();
      playBeep(2200);

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission === 'granted' && !compassActive) {
            window.addEventListener('deviceorientation', onDeviceOrientation, true);
            compassActive = true;
          }
        } catch (e) {
          console.warn("コンパス許可エラー:", e);
        }
      } else if (!compassActive) {
        window.addEventListener('deviceorientation', onDeviceOrientation, true);
        compassActive = true;
      }

      const inputVal = document.getElementById('keyword-input').value.trim();
      appState.activeKeyword = inputVal || "マクドナルド";
      appState.isTracking = true;
      appState.isPaused = false;

      const db = loadSavedData();
      const now = new Date().toISOString();
      if (!db.keywordHistory[appState.activeKeyword]) {
        db.keywordHistory[appState.activeKeyword] = { lastSearch: now, lastArrival: null };
      } else {
        db.keywordHistory[appState.activeKeyword].lastSearch = now;
      }
      saveAppData(db);

      updateSearchStatusUI(true);

      if (!watchId && 'geolocation' in navigator) {
        watchId = navigator.geolocation.watchPosition(onPositionUpdate, (err) => {
          document.getElementById('distance-info').textContent = "GPSエラー: " + err.message;
        }, { 
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        });
      } else {
        executeSearch();
      }
    }

    document.getElementById('set-btn').addEventListener('click', startSearchFromSet);
    document.getElementById('keyword-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') startSearchFromSet();
    });

    document.getElementById('pause-toggle-btn').addEventListener('click', () => {
      initAudio();
      if (!appState.isTracking) {
        startSearchFromSet();
        return;
      }

      appState.isPaused = !appState.isPaused;
      if (appState.isPaused) {
        if (radarTimer) { clearTimeout(radarTimer); radarTimer = null; currentScheduledInterval = null; }
        updateSearchStatusUI(false);
      } else {
        updateSearchStatusUI(true);
        evaluateSensorCycle();
      }
    });

    const pageKeywords = document.getElementById('page-keywords');
    const pageHistory = document.getElementById('page-history');

    document.getElementById('open-keywords-btn').addEventListener('click', () => {
      renderKeywordsList();
      pageKeywords.classList.add('open');
    });

    document.getElementById('back-to-main').addEventListener('click', () => {
      pageKeywords.classList.remove('open');
      evaluateSensorCycle();
    });

    document.getElementById('back-to-keywords').addEventListener('click', () => {
      pageHistory.classList.remove('open');
      renderKeywordsList();
    });

    function setupSwipeBack(el, backCallback) {
      let startX = 0;
      el.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
      el.addEventListener('touchend', (e) => {
        const diffX = e.changedTouches[0].clientX - startX;
        if (diffX > 80) backCallback();
      }, { passive: true });
    }
    setupSwipeBack(pageKeywords, () => document.getElementById('back-to-main').click());
    setupSwipeBack(pageHistory, () => document.getElementById('back-to-keywords').click());

    // ===================================================
    // 7. リスト表示・ソート・トグル
    // ===================================================
    function renderKeywordsList() {
      const db = loadSavedData();
      const container = document.getElementById('keywords-list-container');
      container.innerHTML = '';

      const filterText = document.getElementById('keyword-filter').value.toLowerCase();
      const sortType = document.getElementById('sort-keywords').value;

      let keys = Object.keys(db.keywordHistory).filter(k => k.toLowerCase().includes(filterText));

      keys.sort((a, b) => {
        const dataA = db.keywordHistory[a];
        const dataB = db.keywordHistory[b];
        const countA = db.arrivals.filter(item => item.keyword === a).length;
        const countB = db.arrivals.filter(item => item.keyword === b).length;

        if (sortType === 'recent_search') {
          return new Date(dataB.lastSearch || 0) - new Date(dataA.lastSearch || 0);
        } else if (sortType === 'recent_arrival') {
          return new Date(dataB.lastArrival || 0) - new Date(dataA.lastArrival || 0);
        } else if (sortType === 'count_desc') {
          return countB - countA;
        }
      });

      keys.forEach(k => {
        const count = db.arrivals.filter(item => item.keyword === k).length;
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div>
            <div class="list-item-title">${k}</div>
            <div class="list-item-sub">到達数: ${count} 箇所</div>
          </div>
          <div style="color: var(--sheikah-gold); font-size: 1.4rem;">▶</div>
        `;
        div.addEventListener('click', () => {
          appState.selectedKeywordForHistory = k;
          document.getElementById('history-header-title').textContent = `${k}`;
          renderHistoryList();
          pageHistory.classList.add('open');
        });
        container.appendChild(div);
      });
    }

    function renderHistoryList() {
      const db = loadSavedData();
      const container = document.getElementById('history-list-container');
      container.innerHTML = '';

      const sortType = document.getElementById('sort-history').value;
      let items = db.arrivals.filter(a => a.keyword === appState.selectedKeywordForHistory);

      items.sort((a, b) => {
        if (sortType === 'date_desc') return new Date(b.date) - new Date(a.date);
        if (sortType === 'date_asc') return new Date(a.date) - new Date(b.date);
        if (sortType === 'name_asc') return a.name.localeCompare(b.name, 'ja');
      });

      items.forEach(item => {
        const d = new Date(item.date);
        const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;

        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div>
            <div class="list-item-title">${item.name}</div>
            <div class="list-item-sub">到達: ${dateStr}</div>
          </div>
          <button class="toggle-radar ${item.muted ? 'off' : 'active'}" data-id="${item.id}">
            ${item.muted ? 'レーダーOFF' : 'レーダーON'}
          </button>
        `;

        div.querySelector('.toggle-radar').addEventListener('click', (e) => {
          e.stopPropagation();
          item.muted = !item.muted;
          saveAppData(db);
          renderHistoryList();
        });

        container.appendChild(div);
      });
    }

    document.getElementById('keyword-filter').addEventListener('input', renderKeywordsList);
    document.getElementById('sort-keywords').addEventListener('change', renderKeywordsList);
    document.getElementById('sort-history').addEventListener('change', renderHistoryList);
  </script>
</body>
</html>
