<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHEIKAH SLATE SENSOR</title>
  <style>
    :root {
      --sheikah-cyan: #00f3ff;
      --sheikah-cyan-glow: rgba(0, 243, 255, 0.7);
      --sheikah-orange: #ff9d00;
      --sheikah-gold: #c5a059;
      --sheikah-gold-dark: #6e5426;
      --sheikah-bg: #111417;
      --sheikah-panel: #1b2228;
      --sheikah-border: #3b3226;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
    }

    body {
      background-color: #080a0d;
      color: #e0f8ff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    /* 縦画面コンテナ */
    #app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: var(--sheikah-bg);
      border-left: 2px solid var(--sheikah-border);
      border-right: 2px solid var(--sheikah-border);
      display: flex;
      flex-direction: column;
    }

    /* ===================================================
       画面上部：正円マップ ＆ シーカーレリーフ枠
    =================================================== */
    .top-section {
      width: 100%;
      height: 48vh;
      position: relative;
      background: radial-gradient(circle at center, #262c33 0%, #111417 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 3px solid var(--sheikah-gold);
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* シーカー風装飾ライン（背景） */
    .relic-circuit {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.35;
      background: 
        radial-gradient(circle at 15% 20%, var(--sheikah-orange) 2px, transparent 3px),
        radial-gradient(circle at 85% 80%, var(--sheikah-cyan) 2px, transparent 3px);
    }

    /* 正円マップ外枠（古代金レリーフ調） */
    .circle-map-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, var(--sheikah-gold) 0%, var(--sheikah-gold-dark) 50%, var(--sheikah-gold) 100%);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 10px #000;
    }

    /* 正円マップコンテナ */
    #map-container {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: #03080e;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 中心自機アイコン（進行方向上向き） */
    .player-pointer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 18px solid var(--sheikah-cyan);
      filter: drop-shadow(0 0 8px var(--sheikah-cyan));
      pointer-events: none;
      z-index: 5;
    }

    /* レーダー波紋パルス */
    .radar-pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid var(--sheikah-cyan);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
    }

    .pulse-anim {
      animation: pulse-out-anim 0.5s ease-out forwards;
    }

    @keyframes pulse-out-anim {
      0% { width: 20px; height: 20px; opacity: 1; border-color: #fff; }
      100% { width: 240px; height: 240px; opacity: 0; border-color: var(--sheikah-cyan); }
    }

    /* ===================================================
       画面下部：シーカーコンソール操作パネル
    =================================================== */
    .bottom-section {
      width: 100%;
      height: 52vh;
      background: var(--sheikah-panel);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border-top: 1px solid rgba(197, 160, 89, 0.3);
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .keyword-input-wrap {
      flex: 1;
      position: relative;
    }

    .keyword-input-wrap input {
      width: 100%;
      background: rgba(3, 8, 14, 0.9);
      border: 1.5px solid var(--sheikah-gold);
      color: var(--sheikah-cyan);
      padding: 10px 12px;
      font-size: 1rem;
      border-radius: 4px;
      outline: none;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    }
    .keyword-input-wrap input:focus {
      border-color: var(--sheikah-cyan);
      box-shadow: 0 0 10px var(--sheikah-cyan-glow);
    }

    /* シーカー風ダイヤル錠 */
    .dial-lock {
      width: 80px;
      height: 48px;
      background: linear-gradient(180deg, #111 0%, #2f271a 50%, #111 100%);
      border: 2px solid var(--sheikah-gold);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    .dial-label {
      font-size: 0.6rem;
      color: var(--sheikah-orange);
      letter-spacing: 1px;
    }
    .dial-value {
      font-size: 1rem;
      font-weight: bold;
      color: var(--sheikah-cyan);
      text-shadow: 0 0 5px var(--sheikah-cyan);
    }

    /* 不明件数 ＆ ステータス */
    .status-panel {
      background: rgba(3, 8, 14, 0.6);
      border: 1px solid #334;
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .unknown-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .unknown-count {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--sheikah-orange);
      text-shadow: 0 0 8px var(--sheikah-orange);
    }

    /* アクションボタン */
    .btn-sheikah {
      background: rgba(197, 160, 89, 0.1);
      border: 1.5px solid var(--sheikah-gold);
      color: var(--sheikah-gold);
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-sheikah:active {
      background: var(--sheikah-gold);
      color: #000;
    }

    .btn-activate {
      border-color: var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }
    .btn-activate:active {
      background: var(--sheikah-cyan);
      color: #000;
    }

    /* ===================================================
       スライド画面（リスト・履歴）
    =================================================== */
    .slide-page {
      position: absolute;
      top: 0;
      left: 100%;
      width: 100%;
      height: 100%;
      background: var(--sheikah-bg);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -5px 0 25px rgba(0,0,0,0.9);
    }

    .slide-page.open {
      transform: translateX(-100%);
    }

    .page-header {
      padding: 14px 16px;
      background: #151a20;
      border-bottom: 2px solid var(--sheikah-gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      color: var(--sheikah-cyan);
      background: transparent;
      border: none;
      font-size: 1rem;
      cursor: pointer;
    }

    .filter-bar {
      padding: 8px 14px;
      background: rgba(0,0,0,0.4);
      display: flex;
      gap: 8px;
    }
    .filter-bar input, .filter-bar select {
      background: #111;
      border: 1px solid var(--sheikah-border);
      color: #eee;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
    }
    .filter-bar select { flex: 1; }

    .list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list-item {
      background: rgba(27, 34, 40, 0.9);
      border: 1px solid var(--sheikah-border);
      border-left: 4px solid var(--sheikah-gold);
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-item:active {
      border-color: var(--sheikah-cyan);
    }

    /* トグルスイッチ */
    .toggle-radar {
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: 1px solid #555;
      cursor: pointer;
    }
    .toggle-radar.active {
      border-color: var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      background: rgba(0, 243, 255, 0.15);
    }
    .toggle-radar.off {
      border-color: #666;
      color: #888;
      background: transparent;
    }

    /* 到着告知トースト */
    #toast-banner {
      position: absolute;
      top: 20px;
      left: 5%;
      width: 90%;
      background: rgba(3, 8, 14, 0.95);
      border: 2px solid var(--sheikah-cyan);
      box-shadow: 0 0 20px var(--sheikah-cyan-glow);
      color: #fff;
      padding: 16px;
      border-radius: 6px;
      text-align: center;
      z-index: 200;
      transform: translateY(-150%);
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    #toast-banner.show {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- 到着テロップ -->
    <div id="toast-banner">
      <div style="font-size: 0.75rem; color: var(--sheikah-orange); letter-spacing: 2px;">DISCOVERY COMPLETED</div>
      <div id="toast-text" style="font-size: 1.1rem; font-weight: bold; margin-top: 6px; color: var(--sheikah-cyan);"></div>
    </div>

    <!-- 画面上部：正円マップ -->
    <div class="top-section">
      <div class="relic-circuit"></div>
      <div class="circle-map-wrapper">
        <div id="map-container">
          <div id="map"></div>
          <div class="player-pointer"></div>
          <div class="radar-pulse-ring" id="radar-pulse"></div>
        </div>
      </div>
    </div>

    <!-- 画面下部：シーカーコンソール -->
    <div class="bottom-section">
      <!-- 検索入力 ＆ ダイヤル錠 -->
      <div class="input-row">
        <div class="keyword-input-wrap">
          <input type="text" id="keyword-input" value="中華料理屋" placeholder="探す対象を入力...">
        </div>
        <div class="dial-lock" id="dial-btn">
          <div class="dial-label">RADIUS</div>
          <div class="dial-value" id="radius-val">1km</div>
        </div>
      </div>

      <!-- 不明件数 ＆ センサー情報 -->
      <div class="status-panel">
        <div>
          <div style="font-size: 0.7rem; color: #889;">未踏の目的地</div>
          <div class="unknown-badge">
            <span class="unknown-count" id="unknown-count">0</span>
            <span style="font-size: 0.8rem; color: #bbb;">件探知中</span>
          </div>
        </div>
        <div id="distance-info" style="font-size: 0.8rem; color: var(--sheikah-cyan); text-align: right;">
          待機中...
        </div>
      </div>

      <!-- 起動 ＆ 到達リストボタン -->
      <button class="btn-sheikah btn-activate" id="activate-btn">SENSOR ACTIVATE</button>
      <button class="btn-sheikah" id="open-keywords-btn">到達済みリスト (図鑑)</button>
    </div>

    <!-- ===================================================
         第2画面：検索キーワード履歴リスト
    =================================================== -->
    <div class="slide-page" id="page-keywords">
      <div class="page-header">
        <button class="back-btn" id="back-to-main">◀ メイン</button>
        <div style="font-weight: bold; color: var(--sheikah-gold);">キーワード履歴</div>
        <div style="width: 40px;"></div>
      </div>
      <div class="filter-bar">
        <input type="text" id="keyword-filter" placeholder="キーワード絞り込み..." style="flex: 1;">
        <select id="sort-keywords">
          <option value="recent_search">検索日時順</option>
          <option value="recent_arrival">到達日時順</option>
          <option value="count_desc">到達件数降順</option>
        </select>
      </div>
      <div class="list-scroll" id="keywords-list-container"></div>
    </div>

    <!-- ===================================================
         第3画面：各キーワードの到達履歴リスト
    =================================================== -->
    <div class="slide-page" id="page-history">
      <div class="page-header">
        <button class="back-btn" id="back-to-keywords">◀ キーワード一覧</button>
        <div id="history-header-title" style="font-weight: bold; color: var(--sheikah-cyan);">到達履歴</div>
        <div style="width: 40px;"></div>
      </div>
      <div class="filter-bar">
        <select id="sort-history">
          <option value="date_desc">到達日時が新しい順</option>
          <option value="date_asc">到達日時が古い順</option>
          <option value="name_asc">名称あいうえお順</option>
        </select>
      </div>
      <div class="list-scroll" id="history-list-container"></div>
    </div>
  </div>

  <!-- Google Maps JavaScript API (※API_KEYがない場合は自動モックが起動します) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=&libraries=places"></script>

  <script>
    // ===================================================
    // 1. Web Audio API：シーカーセンサー音 ＆ 宝箱解放音
    // ===================================================
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    // シーカーセンサー ピピ音
    function playBeep(freq = 1800) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.05, audioCtx.currentTime + 0.06);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    // 宝箱オープン風の解放アルペジオファンファーレ
    function playTreasureFanfare() {
      if (!audioCtx) return;
      // ゼルダ風アルペジオノート (ド・レ・ミ・ファ・ソ・ラ・シ・高ド...)
      const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50, 1174.66, 1318.51];
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

          const dur = (idx === notes.length - 1) ? 1.5 : 0.18;
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        }, idx * 110);
      });
    }

    // ===================================================
    // 2. 状態管理・ローカルストレージ（図鑑・到達データ）
    // ===================================================
    const RADIUS_OPTIONS = [100, 1000, 3000, 10000, 50000, 100000];
    let radiusIndex = 1; // 初期値: 1km

    let appState = {
      isTracking: false,
      currentPos: null,
      prevPos: null,
      currentHeading: 0, // 進行方位（度）
      activeKeyword: "中華料理屋",
      selectedKeywordForHistory: null,
      places: [] // 現在索敵中のスポット
    };

    // localStorageから保存データを読み込み
    function loadSavedData() {
      const data = localStorage.getItem('sheikah_db_v1');
      if (data) return JSON.parse(data);
      return {
        keywordHistory: {}, // { "中華料理屋": { lastSearch: "...", lastArrival: "..." } }
        arrivals: []        // [ { id, name, keyword, lat, lng, date, muted: true } ]
      };
    }

    function saveAppData(db) {
      localStorage.setItem('sheikah_db_v1', JSON.stringify(db));
    }

    // ===================================================
    // 3. Google Maps 初期化（正円・POI非表示・ダークスタイル）
    // ===================================================
    let map = null;
    let markers = {};

    const sheikahMapStyle = [
      { elementType: "geometry", stylers: [{ color: "#081018" }] },
      { elementType: "labels.text.stroke", stylers: [{ visibility: "off" }] },
      { elementType: "labels.text.fill", stylers: [{ color: "#32506d" }] },
      { featureType: "poi", stylers: [{ visibility: "off" }] }, // 建物名・店舗非表示！
      { featureType: "transit", stylers: [{ visibility: "off" }] },
      { featureType: "road", elementType: "geometry", stylers: [{ color: "#142433" }] },
      { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#1f3950" }] },
      { featureType: "water", elementType: "geometry", stylers: [{ color: "#02070d" }] }
    ];

    function initMap(lat, lng) {
      if (typeof google === 'undefined' || !google.maps) {
        console.warn("Google Maps SDK未読込のためモック動作します");
        return;
      }
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat, lng },
        zoom: 17,
        disableDefaultUI: true,
        styles: sheikahMapStyle,
        gestureHandling: 'none' // 正円内での手動操作を抑制
      });
    }

    // ===================================================
    // 4. 地理・ベクトル計算 ＆ センサーロジック
    // ===================================================
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    let radarTimer = null;
    let lastEvaluatedDistance = null;

    function evaluateSensorCycle() {
      if (!appState.isTracking || !appState.currentPos) return;

      const db = loadSavedData();
      const activeTargets = appState.places.filter(p => {
        const item = db.arrivals.find(a => a.id === p.id);
        return !item || !item.muted; // ミュート（到達済み）されていないもの
      });

      document.getElementById('unknown-count').textContent = activeTargets.length;
      if (activeTargets.length === 0) {
        document.getElementById('distance-info').textContent = "反応なし（未踏地なし）";
        if (radarTimer) clearTimeout(radarTimer);
        return;
      }

      // 各ターゲットまでの距離と方角差を計算
      let closestTarget = null;
      let minDistance = Infinity;
      let targetBearingDiff = 0;

      activeTargets.forEach(t => {
        const d = getDistance(appState.currentPos.lat, appState.currentPos.lng, t.lat, t.lng);
        if (d < minDistance) {
          minDistance = d;
          closestTarget = t;
          const bearing = getBearing(appState.currentPos.lat, appState.currentPos.lng, t.lat, t.lng);
          let diff = Math.abs(appState.currentHeading - bearing);
          if (diff > 180) diff = 360 - diff;
          targetBearingDiff = diff;
        }
      });

      document.getElementById('distance-info').textContent = `最寄り: 約${Math.round(minDistance)}m`;

      // 【到達判定】10m以内
      if (minDistance <= 10) {
        handleArrival(closestTarget);
        return;
      }

      // 【接近判定】前回の距離より近づいているか？
      const isApproaching = (lastEvaluatedDistance === null || minDistance < lastEvaluatedDistance);
      lastEvaluatedDistance = minDistance;

      // センサー周期の計算
      let interval = null;

      if (minDistance <= 200) {
        // 200m以内
        if (targetBearingDiff <= 35) {
          // 移動方向の正面に対象がある ➔ 高周期（激しく反応）
          interval = 240;
        } else if (isApproaching) {
          // 移動方向は逸れているが、距離自体は縮まっている ➔ 中周期
          interval = 700;
        }
      } else {
        // かなり離れているとき（200m超）
        if (isApproaching) {
          // 距離が縮んでいれば ➔ 低周期
          interval = 1600;
        }
      }

      // 音と波紋のスケジュール
      if (interval !== null) {
        scheduleRadarSound(interval);
      } else {
        if (radarTimer) clearTimeout(radarTimer);
      }
    }

    function scheduleRadarSound(interval) {
      if (radarTimer) clearTimeout(radarTimer);
      function pulse() {
        if (!appState.isTracking) return;
        playBeep(interval < 300 ? 2100 : 1700);

        // 波紋アニメーション
        const wave = document.getElementById('radar-pulse');
        wave.classList.remove('pulse-anim');
        void wave.offsetWidth;
        wave.classList.add('pulse-anim');

        radarTimer = setTimeout(pulse, interval);
      }
      pulse();
    }

    // 到達イベント（10m以内）
    function handleArrival(target) {
      appState.isTracking = false;
      if (radarTimer) clearTimeout(radarTimer);

      // 解放ファンファーレ演奏
      playTreasureFanfare();

      // 到達データを登録＆自動ミュート（レーダー無効化）
      const db = loadSavedData();
      const now = new Date().toISOString();
      const existing = db.arrivals.find(a => a.id === target.id);
      if (!existing) {
        db.arrivals.push({
          id: target.id,
          name: target.name,
          keyword: appState.activeKeyword,
          lat: target.lat,
          lng: target.lng,
          date: now,
          muted: true // 到達時は自動で無効化
        });
      }
      if (!db.keywordHistory[appState.activeKeyword]) {
        db.keywordHistory[appState.activeKeyword] = { lastSearch: now, lastArrival: now };
      } else {
        db.keywordHistory[appState.activeKeyword].lastArrival = now;
      }
      saveAppData(db);

      // マップ上に到着ピンを立てる
      if (map) {
        new google.maps.Marker({
          position: { lat: target.lat, lng: target.lng },
          map: map,
          title: target.name,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: "#00f3ff",
            fillOpacity: 1,
            strokeWeight: 2,
            strokeColor: "#ffffff"
          }
        });
      }

      // 到達告知テロップ
      const toast = document.getElementById('toast-banner');
      document.getElementById('toast-text').textContent = `マップに「${target.name}」が記録されました`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4500);

      document.getElementById('activate-btn').textContent = "SEARCH AGAIN";
      document.getElementById('distance-info').textContent = "到達完了！";
      document.getElementById('unknown-count').textContent = "0";
    }

    // ===================================================
    // 5. GPS位置情報 ＆ 進行方向によるマップ自動回転補正
    // ===================================================
    function onPositionUpdate(pos) {
      const newPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      appState.currentPos = newPos;

      if (!map) initMap(newPos.lat, newPos.lng);

      if (appState.prevPos) {
        const moved = getDistance(appState.prevPos.lat, appState.prevPos.lng, newPos.lat, newPos.lng);
        // 2m以上の移動があれば進行方向を更新（信号待ち等では直前の方角を保持）
        if (moved >= 2.0) {
          appState.currentHeading = getBearing(appState.prevPos.lat, appState.prevPos.lng, newPos.lat, newPos.lng);
          appState.prevPos = newPos;
        }
      } else {
        appState.prevPos = newPos;
      }

      // マップの回転補正：自分の進行方向が常に「画面の上」になるようにマップ要素を回転
      if (map) {
        map.setCenter(newPos);
        const mapDiv = document.getElementById('map');
        mapDiv.style.transform = `rotate(${-appState.currentHeading}deg)`;
        mapDiv.style.transformOrigin = 'center center';
      }

      // テスト用：周辺スポットが存在しない場合、現在地の周囲にダミースポットを生成
      if (appState.places.length === 0) {
        generateMockPlaces(newPos);
      }

      evaluateSensorCycle();
    }

    // モックスポット生成（API未接続時でも動作可能）
    function generateMockPlaces(pos) {
      appState.places = [
        { id: "mock_1", name: "中華料理 龍鳳（路地裏店）", lat: pos.lat + 0.0008, lng: pos.lng + 0.0003 },
        { id: "mock_2", name: "町中華 餃子館", lat: pos.lat - 0.0012, lng: pos.lng + 0.0015 },
        { id: "mock_3", name: "四川風ラーメン 龍門", lat: pos.lat + 0.002, lng: pos.lng - 0.001 }
      ];
      evaluateSensorCycle();
    }

    // ===================================================
    // 6. UIイベント・ダイヤル錠・スライド画面
    // ===================================================
    // ダイヤル錠を回す（半径の切り替え）
    document.getElementById('dial-btn').addEventListener('click', () => {
      radiusIndex = (radiusIndex + 1) % RADIUS_OPTIONS.length;
      const r = RADIUS_OPTIONS[radiusIndex];
      document.getElementById('radius-val').textContent = r >= 1000 ? `${r/1000}km` : `${r}m`;
      if (appState.currentPos) generateMockPlaces(appState.currentPos);
    });

    // センサー起動
    document.getElementById('activate-btn').addEventListener('click', () => {
      initAudio();
      appState.activeKeyword = document.getElementById('keyword-input').value.trim() || "スポット";
      appState.isTracking = true;

      // キーワード検索日時の記録
      const db = loadSavedData();
      const now = new Date().toISOString();
      if (!db.keywordHistory[appState.activeKeyword]) {
        db.keywordHistory[appState.activeKeyword] = { lastSearch: now, lastArrival: null };
      } else {
        db.keywordHistory[appState.activeKeyword].lastSearch = now;
      }
      saveAppData(db);

      document.getElementById('activate-btn').textContent = "SEARCHING...";

      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(onPositionUpdate, (err) => {
          document.getElementById('distance-info').textContent = "GPSエラー: " + err.message;
        }, { enableHighAccuracy: true });
      }
    });

    // 画面遷移ハンドラー
    const pageKeywords = document.getElementById('page-keywords');
    const pageHistory = document.getElementById('page-history');

    document.getElementById('open-keywords-btn').addEventListener('click', () => {
      renderKeywordsList();
      pageKeywords.classList.add('open');
    });

    document.getElementById('back-to-main').addEventListener('click', () => {
      pageKeywords.classList.remove('open');
      evaluateSensorCycle(); // 戻った時にミュート状態を再計算
    });

    document.getElementById('back-to-keywords').addEventListener('click', () => {
      pageHistory.classList.remove('open');
      renderKeywordsList();
    });

    // スワイプバック（左から右へのスワイプで戻る）
    function setupSwipeBack(el, backCallback) {
      let startX = 0;
      el.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
      el.addEventListener('touchend', (e) => {
        const diffX = e.changedTouches[0].clientX - startX;
        if (diffX > 80) backCallback(); // 右方向に80px以上スワイプで戻る
      }, { passive: true });
    }
    setupSwipeBack(pageKeywords, () => document.getElementById('back-to-main').click());
    setupSwipeBack(pageHistory, () => document.getElementById('back-to-keywords').click());

    // ===================================================
    // 7. リスト表示・ソート・トグル操作
    // ===================================================
    // キーワード一覧の描画
    function renderKeywordsList() {
      const db = loadSavedData();
      const container = document.getElementById('keywords-list-container');
      container.innerHTML = '';

      const filterText = document.getElementById('keyword-filter').value.toLowerCase();
      const sortType = document.getElementById('sort-keywords').value;

      let keys = Object.keys(db.keywordHistory).filter(k => k.toLowerCase().includes(filterText));

      keys.sort((a, b) => {
        const dataA = db.keywordHistory[a];
        const dataB = db.keywordHistory[b];
        const countA = db.arrivals.filter(item => item.keyword === a).length;
        const countB = db.arrivals.filter(item => item.keyword === b).length;

        if (sortType === 'recent_search') {
          return new Date(dataB.lastSearch || 0) - new Date(dataA.lastSearch || 0);
        } else if (sortType === 'recent_arrival') {
          return new Date(dataB.lastArrival || 0) - new Date(dataA.lastArrival || 0);
        } else if (sortType === 'count_desc') {
          return countB - countA;
        }
      });

      keys.forEach(k => {
        const count = db.arrivals.filter(item => item.keyword === k).length;
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div>
            <div style="font-weight: bold; font-size: 1.05rem; color: #fff;">${k}</div>
            <div style="font-size: 0.75rem; color: #889; margin-top: 3px;">到達数: ${count} 箇所</div>
          </div>
          <div style="color: var(--sheikah-gold); font-size: 1.2rem;">▶</div>
        `;
        div.addEventListener('click', () => {
          appState.selectedKeywordForHistory = k;
          document.getElementById('history-header-title').textContent = `${k} の到達履歴`;
          renderHistoryList();
          pageHistory.classList.add('open');
        });
        container.appendChild(div);
      });
    }

    // 各キーワードの到達場所履歴の描画
    function renderHistoryList() {
      const db = loadSavedData();
      const container = document.getElementById('history-list-container');
      container.innerHTML = '';

      const sortType = document.getElementById('sort-history').value;
      let items = db.arrivals.filter(a => a.keyword === appState.selectedKeywordForHistory);

      items.sort((a, b) => {
        if (sortType === 'date_desc') return new Date(b.date) - new Date(a.date);
        if (sortType === 'date_asc') return new Date(a.date) - new Date(b.date);
        if (sortType === 'name_asc') return a.name.localeCompare(b.name, 'ja');
      });

      items.forEach(item => {
        const d = new Date(item.date);
        const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;

        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div>
            <div style="font-weight: bold; color: #fff;">${item.name}</div>
            <div style="font-size: 0.75rem; color: #889; margin-top: 2px;">到達: ${dateStr}</div>
          </div>
          <button class="toggle-radar ${item.muted ? 'off' : 'active'}" data-id="${item.id}">
            ${item.muted ? 'レーダーOFF' : 'レーダーON'}
          </button>
        `;

        // レーダー再オン/オフ切り替え
        div.querySelector('.toggle-radar').addEventListener('click', (e) => {
          e.stopPropagation();
          item.muted = !item.muted;
          saveAppData(db);
          renderHistoryList();
        });

        container.appendChild(div);
      });
    }

    document.getElementById('keyword-filter').addEventListener('input', renderKeywordsList);
    document.getElementById('sort-keywords').addEventListener('change', renderKeywordsList);
    document.getElementById('sort-history').addEventListener('change', renderHistoryList);
  </script>
</body>
</html>
