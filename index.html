<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHEIKAH SLATE SENSOR</title>
  <style>
    :root {
      --sheikah-cyan: #00f3ff;
      --sheikah-cyan-glow: rgba(0, 243, 255, 0.7);
      --sheikah-orange: #ff9d00;
      --sheikah-gold: #c5a059;
      --sheikah-gold-dark: #6e5426;
      --sheikah-bg: #111417;
      --sheikah-panel: #1b2228;
      --sheikah-border: #3b3226;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
    }

    body {
      background-color: #080a0d;
      color: #e0f8ff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: var(--sheikah-bg);
      border-left: 2px solid var(--sheikah-border);
      border-right: 2px solid var(--sheikah-border);
      display: flex;
      flex-direction: column;
    }

    /* ===================================================
       上部：画面横幅いっぱいの正円マップエリア
    =================================================== */
    .top-section {
      width: 100%;
      height: 52vh; /* マップの表示エリアを拡大 */
      position: relative;
      background: radial-gradient(circle at center, #262c33 0%, #111417 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 3px solid var(--sheikah-gold);
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    .relic-circuit {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.35;
      background: 
        radial-gradient(circle at 10% 15%, var(--sheikah-orange) 2px, transparent 3px),
        radial-gradient(circle at 90% 85%, var(--sheikah-cyan) 2px, transparent 3px);
    }

    /* 横幅フル（画面幅94%）の正円外枠 */
    .circle-map-wrapper {
      position: relative;
      width: min(94vw, 360px);
      height: min(94vw, 360px);
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, var(--sheikah-gold) 0%, var(--sheikah-gold-dark) 50%, var(--sheikah-gold) 100%);
      box-shadow: 0 0 28px rgba(0, 243, 255, 0.45), inset 0 0 10px #000;
    }

    #map-container {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: #03080e;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Googleマップの残存ラベル・テキストをブラウザ側でも強制非表示 */
    .gm-style-cc, .gmnoprint, a[href^="https://maps.google.com/maps"] {
      display: none !important;
    }

    .player-pointer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 20px solid var(--sheikah-cyan);
      filter: drop-shadow(0 0 10px var(--sheikah-cyan));
      pointer-events: none;
      z-index: 5;
    }

    .radar-pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid var(--sheikah-cyan);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
    }

    .pulse-anim {
      animation: pulse-out-anim 0.65s ease-out forwards;
    }

    @keyframes pulse-out-anim {
      0% { width: 30px; height: 30px; opacity: 1; border-color: #fff; }
      100% { width: 340px; height: 340px; opacity: 0; border-color: var(--sheikah-cyan); }
    }

    /* ===================================================
       下部：操作パネル
    =================================================== */
    .bottom-section {
      width: 100%;
      height: 48vh;
      background: var(--sheikah-panel);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border-top: 1px solid rgba(197, 160, 89, 0.3);
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .keyword-input-wrap {
      flex: 1;
      position: relative;
    }

    .keyword-input-wrap input {
      width: 100%;
      background: rgba(3, 8, 14, 0.9);
      border: 1.5px solid var(--sheikah-gold);
      color: var(--sheikah-cyan);
      padding: 9px 10px;
      font-size: 0.95rem;
      border-radius: 4px;
      outline: none;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    }
    .keyword-input-wrap input:focus {
      border-color: var(--sheikah-cyan);
      box-shadow: 0 0 10px var(--sheikah-cyan-glow);
    }

    .dial-lock {
      width: 68px;
      height: 42px;
      background: linear-gradient(180deg, #111 0%, #2f271a 50%, #111 100%);
      border: 1.5px solid var(--sheikah-gold);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    .dial-label {
      font-size: 0.55rem;
      color: var(--sheikah-orange);
      letter-spacing: 1px;
    }
    .dial-value {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--sheikah-cyan);
    }

    .btn-set {
      height: 42px;
      padding: 0 14px;
      background: rgba(0, 243, 255, 0.15);
      border: 1.5px solid var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }
    .btn-set:active {
      background: var(--sheikah-cyan);
      color: #000;
    }

    .status-panel {
      background: rgba(3, 8, 14, 0.65);
      border: 1px solid #334;
      border-radius: 6px;
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .target-meta-info {
      font-size: 0.75rem;
      color: var(--sheikah-cyan);
      margin-bottom: 3px;
      opacity: 0.95;
    }

    .unknown-badge {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .unknown-count {
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--sheikah-orange);
      text-shadow: 0 0 8px var(--sheikah-orange);
    }

    .search-status-badge {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .status-indicator {
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .status-indicator.active {
      color: var(--sheikah-cyan);
      animation: blink-anim 1.5s infinite;
    }
    .status-indicator.paused {
      color: #889;
    }

    @keyframes blink-anim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .btn-sheikah {
      background: rgba(197, 160, 89, 0.1);
      border: 1.5px solid var(--sheikah-gold);
      color: var(--sheikah-gold);
      padding: 11px;
      font-size: 0.92rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-sheikah:active {
      background: var(--sheikah-gold);
      color: #000;
    }

    .btn-pause-toggle {
      border-color: var(--sheikah-orange);
      color: var(--sheikah-orange);
      box-shadow: 0 0 8px rgba(255, 157, 0, 0.2);
    }
    .btn-pause-toggle.paused {
      border-color: var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .slide-page {
      position: absolute;
      top: 0;
      left: 100%;
      width: 100%;
      height: 100%;
      background: var(--sheikah-bg);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: -5px 0 25px rgba(0,0,0,0.9);
    }
    .slide-page.open {
      transform: translateX(-100%);
    }

    .page-header {
      padding: 14px 16px;
      background: #151a20;
      border-bottom: 2px solid var(--sheikah-gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-btn {
      color: var(--sheikah-cyan);
      background: transparent;
      border: none;
      font-size: 1rem;
      cursor: pointer;
    }

    .filter-bar {
      padding: 8px 14px;
      background: rgba(0,0,0,0.4);
      display: flex;
      gap: 8px;
    }
    .filter-bar input, .filter-bar select {
      background: #111;
      border: 1px solid var(--sheikah-border);
      color: #eee;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
    }
    .filter-bar select { flex: 1; }

    .list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list-item {
      background: rgba(27, 34, 40, 0.9);
      border: 1px solid var(--sheikah-border);
      border-left: 4px solid var(--sheikah-gold);
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-radar {
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: 1px solid #555;
      cursor: pointer;
    }
    .toggle-radar.active {
      border-color: var(--sheikah-cyan);
      color: var(--sheikah-cyan);
      background: rgba(0, 243, 255, 0.15);
    }
    .toggle-radar.off {
      border-color: #666;
      color: #888;
      background: transparent;
    }

    #toast-banner {
      position: absolute;
      top: 20px;
      left: 5%;
      width: 90%;
      background: rgba(3, 8, 14, 0.95);
      border: 2px solid var(--sheikah-cyan);
      box-shadow: 0 0 20px var(--sheikah-cyan-glow);
      color: #fff;
      padding: 16px;
      border-radius: 6px;
      text-align: center;
      z-index: 200;
      transform: translateY(-150%);
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    #toast-banner.show {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="toast-banner">
      <div style="font-size: 0.75rem; color: var(--sheikah-orange); letter-spacing: 2px;">DISCOVERY COMPLETED</div>
      <div id="toast-text" style="font-size: 1.05rem; font-weight: bold; margin-top: 6px; color: var(--sheikah-cyan);"></div>
    </div>

    <!-- 上部：横幅最大の正円マップ -->
    <div class="top-section">
      <div class="relic-circuit"></div>
      <div class="circle-map-wrapper">
        <div id="map-container">
          <div id="map"></div>
          <div class="player-pointer"></div>
          <div class="radar-pulse-ring" id="radar-pulse"></div>
        </div>
      </div>
    </div>

    <!-- 下部：操作パネル -->
    <div class="bottom-section">
      <div class="input-row">
        <div class="keyword-input-wrap">
          <input type="text" id="keyword-input" value="大学" placeholder="探す対象を入力...">
        </div>
        <div class="dial-lock" id="dial-btn">
          <div class="dial-label">RADIUS</div>
          <div class="dial-value" id="radius-val">100m</div>
        </div>
        <button class="btn-set" id="set-btn">SET</button>
      </div>

      <div class="status-panel">
        <div>
          <div class="target-meta-info" id="target-meta-info">[対象: 大学 / 範囲: 100m]</div>
          <div class="unknown-badge">
            <span style="font-size: 0.75rem; color: #889;">未踏:</span>
            <span class="unknown-count" id="unknown-count">0</span>
            <span style="font-size: 0.8rem; color: #bbb;">件探知中</span>
          </div>
        </div>
        <div class="search-status-badge">
          <div class="status-indicator paused" id="status-indicator">STANDBY</div>
          <div id="distance-info" style="font-size: 0.8rem; color: var(--sheikah-cyan);">
            --
          </div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-sheikah btn-pause-toggle" id="pause-toggle-btn">PAUSE SENSOR</button>
        <button class="btn-sheikah" id="open-keywords-btn">到達済みリスト (図鑑)</button>
      </div>
    </div>

    <!-- 第2画面：キーワード履歴 -->
    <div class="slide-page" id="page-keywords">
      <div class="page-header">
        <button class="back-btn" id="back-to-main">◀ メイン</button>
        <div style="font-weight: bold; color: var(--sheikah-gold);">キーワード履歴</div>
        <div style="width: 40px;"></div>
      </div>
      <div class="filter-bar">
        <input type="text" id="keyword-filter" placeholder="キーワード絞り込み..." style="flex: 1;">
        <select id="sort-keywords">
          <option value="recent_search">検索日時順</option>
          <option value="recent_arrival">到達日時順</option>
          <option value="count_desc">到達件数降順</option>
        </select>
      </div>
      <div class="list-scroll" id="keywords-list-container"></div>
    </div>

    <!-- 第3画面：到達場所履歴 -->
    <div class="slide-page" id="page-history">
      <div class="page-header">
        <button class="back-btn" id="back-to-keywords">◀ キーワード一覧</button>
        <div id="history-header-title" style="font-weight: bold; color: var(--sheikah-cyan);">到達履歴</div>
        <div style="width: 40px;"></div>
      </div>
      <div class="filter-bar">
        <select id="sort-history">
          <option value="date_desc">到達日時が新しい順</option>
          <option value="date_asc">到達日時が古い順</option>
          <option value="name_asc">名称あいうえお順</option>
        </select>
      </div>
      <div class="list-scroll" id="history-list-container"></div>
    </div>
  </div>

  <script src="https://maps.googleapis.com/maps/api/js?key=&libraries=places"></script>

  <script>
    // ===================================================
    // 1. Web Audio API 音源
    // ===================================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playBeep(freq = 1800) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.04, audioCtx.currentTime + 0.08);

      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playTreasureFanfare() {
      if (!audioCtx) return;
      const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50, 1174.66, 1318.51];
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

          const dur = (idx === notes.length - 1) ? 1.5 : 0.18;
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        }, idx * 115);
      });
    }

    // ===================================================
    // 2. 状態管理
    // ===================================================
    const RADIUS_OPTIONS = [100, 1000, 3000, 10000, 50000, 100000];
    let radiusIndex = 0;

    let appState = {
      isTracking: false,
      isPaused: false,
      currentPos: null,
      prevPos: null,
      lastSearchedPos: null,
      currentHeading: 0,
      activeKeyword: "大学",
      selectedKeywordForHistory: null,
      places: []
    };

    let watchId = null;

    function loadSavedData() {
      const data = localStorage.getItem('sheikah_db_v1');
      if (data) return JSON.parse(data);
      return { keywordHistory: {}, arrivals: [] };
    }

    function saveAppData(db) {
      localStorage.setItem('sheikah_db_v1', JSON.stringify(db));
    }

    // ===================================================
    // 3. Google Maps（建物名・店舗・文字を完全シャットアウト）
    // ===================================================
    let map = null;

    const sheikahMapStyle = [
      {
        featureType: "all",
        elementType: "labels",
        stylers: [{ visibility: "off" }]
      },
      {
        featureType: "all",
        elementType: "labels.text",
        stylers: [{ visibility: "off" }]
      },
      {
        featureType: "all",
        elementType: "labels.icon",
        stylers: [{ visibility: "off" }]
      },
      {
        featureType: "poi",
        stylers: [{ visibility: "off" }]
      },
      {
        featureType: "administrative",
        stylers: [{ visibility: "off" }]
      },
      {
        featureType: "transit",
        stylers: [{ visibility: "off" }]
      },
      {
        featureType: "road",
        elementType: "labels",
        stylers: [{ visibility: "off" }]
      },
      {
        elementType: "geometry",
        stylers: [{ color: "#081018" }]
      },
      {
        featureType: "road",
        elementType: "geometry",
        stylers: [{ color: "#142433" }]
      },
      {
        featureType: "water",
        elementType: "geometry",
        stylers: [{ color: "#02070d" }]
      }
    ];

    function initMap(lat, lng) {
      if (typeof google === 'undefined' || !google.maps) return;
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat, lng },
        zoom: 17,
        disableDefaultUI: true,
        styles: sheikahMapStyle,
        gestureHandling: 'none'
      });
    }

    // ===================================================
    // 4. 幾何計算 ＆ センサーロジック
    // ===================================================
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    let radarTimer = null;
    let lastEvaluatedDistance = null;

    function evaluateSensorCycle() {
      if (!appState.isTracking || appState.isPaused || !appState.currentPos) {
        if (radarTimer) clearTimeout(radarTimer);
        return;
      }

      const db = loadSavedData();
      const activeTargets = appState.places.filter(p => {
        const item = db.arrivals.find(a => a.id === p.id);
        return !item || !item.muted;
      });

      document.getElementById('unknown-count').textContent = activeTargets.length;
      if (activeTargets.length === 0) {
        document.getElementById('distance-info').textContent = "未踏スポットなし";
        if (radarTimer) clearTimeout(radarTimer);
        return;
      }

      let closestTarget = null;
      let minDistance = Infinity;
      let targetBearingDiff = 0;

      activeTargets.forEach(t => {
        const d = getDistance(appState.currentPos.lat, appState.currentPos.lng, t.lat, t.lng);
        if (d < minDistance) {
          minDistance = d;
          closestTarget = t;
          const bearing = getBearing(appState.currentPos.lat, appState.currentPos.lng, t.lat, t.lng);
          let diff = Math.abs(appState.currentHeading - bearing);
          if (diff > 180) diff = 360 - diff;
          targetBearingDiff = diff;
        }
      });

      document.getElementById('distance-info').textContent = `最寄り: 約${Math.round(minDistance)}m`;

      if (minDistance <= 10) {
        handleArrival(closestTarget);
        return;
      }

      const isApproaching = (lastEvaluatedDistance === null || minDistance < lastEvaluatedDistance);
      lastEvaluatedDistance = minDistance;

      let interval = null;
      if (minDistance <= 200) {
        if (targetBearingDiff <= 35) {
          interval = 650;
        } else if (isApproaching) {
          interval = 1500;
        }
      } else {
        if (isApproaching) {
          interval = 2800;
        }
      }

      if (interval !== null) {
        scheduleRadarSound(interval);
      } else {
        if (radarTimer) clearTimeout(radarTimer);
      }
    }

    function scheduleRadarSound(interval) {
      if (radarTimer) clearTimeout(radarTimer);
      function pulse() {
        if (!appState.isTracking || appState.isPaused) return;
        playBeep(interval <= 700 ? 2100 : 1750);

        const wave = document.getElementById('radar-pulse');
        wave.classList.remove('pulse-anim');
        void wave.offsetWidth;
        wave.classList.add('pulse-anim');

        radarTimer = setTimeout(pulse, interval);
      }
      pulse();
    }

    function handleArrival(target) {
      appState.isTracking = false;
      if (radarTimer) clearTimeout(radarTimer);

      playTreasureFanfare();

      const db = loadSavedData();
      const now = new Date().toISOString();
      const existing = db.arrivals.find(a => a.id === target.id);
      if (!existing) {
        db.arrivals.push({
          id: target.id,
          name: target.name,
          keyword: appState.activeKeyword,
          lat: target.lat,
          lng: target.lng,
          date: now,
          muted: true
        });
      }
      if (!db.keywordHistory[appState.activeKeyword]) {
        db.keywordHistory[appState.activeKeyword] = { lastSearch: now, lastArrival: now };
      } else {
        db.keywordHistory[appState.activeKeyword].lastArrival = now;
      }
      saveAppData(db);

      if (map) {
        new google.maps.Marker({
          position: { lat: target.lat, lng: target.lng },
          map: map,
          title: target.name,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 8,
            fillColor: "#00f3ff",
            fillOpacity: 1,
            strokeWeight: 2,
            strokeColor: "#ffffff"
          }
        });
      }

      const toast = document.getElementById('toast-banner');
      document.getElementById('toast-text').textContent = `マップに「${target.name}」が記録されました`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4500);

      updateSearchStatusUI(false);
      document.getElementById('distance-info').textContent = "到達完了！";
      document.getElementById('unknown-count').textContent = "0";
    }

    // ===================================================
    // 5. GPS位置情報 ＆ 移動自動再検索
    // ===================================================
    function onPositionUpdate(pos) {
      const newPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      appState.currentPos = newPos;

      if (!map) initMap(newPos.lat, newPos.lng);

      if (appState.prevPos) {
        const moved = getDistance(appState.prevPos.lat, appState.prevPos.lng, newPos.lat, newPos.lng);
        if (moved >= 2.0) {
          appState.currentHeading = getBearing(appState.prevPos.lat, appState.prevPos.lng, newPos.lat, newPos.lng);
          appState.prevPos = newPos;
        }
      } else {
        appState.prevPos = newPos;
      }

      if (map) {
        map.setCenter(newPos);
        const mapDiv = document.getElementById('map');
        mapDiv.style.transform = `rotate(${-appState.currentHeading}deg)`;
        mapDiv.style.transformOrigin = 'center center';
      }

      if (appState.lastSearchedPos) {
        const movedSinceSearch = getDistance(appState.lastSearchedPos.lat, appState.lastSearchedPos.lng, newPos.lat, newPos.lng);
        if (movedSinceSearch >= 50) {
          executeSearch();
        }
      } else {
        executeSearch();
      }

      evaluateSensorCycle();
    }

    function executeSearch() {
      if (!appState.currentPos) return;
      appState.lastSearchedPos = { ...appState.currentPos };
      const currentRadius = RADIUS_OPTIONS[radiusIndex];

      const rText = currentRadius >= 1000 ? `${currentRadius/1000}km` : `${currentRadius}m`;
      document.getElementById('target-meta-info').textContent = `[対象: ${appState.activeKeyword} / 範囲: ${rText}]`;

      const rDeg = (currentRadius / 111000) * 0.7;
      appState.places = [
        { id: `mock_1_${currentRadius}`, name: `${appState.activeKeyword} A地点`, lat: appState.currentPos.lat + rDeg * 0.8, lng: appState.currentPos.lng + rDeg * 0.3 },
        { id: `mock_2_${currentRadius}`, name: `${appState.activeKeyword} B地点`, lat: appState.currentPos.lat - rDeg * 0.5, lng: appState.currentPos.lng + rDeg * 0.7 },
        { id: `mock_3_${currentRadius}`, name: `${appState.activeKeyword} C地点`, lat: appState.currentPos.lat + rDeg * 0.4, lng: appState.currentPos.lng - rDeg * 0.6 }
      ];

      evaluateSensorCycle();
    }

    // ===================================================
    // 6. UI制御
    // ===================================================
    function getRadiusText(r) {
      return r >= 1000 ? `${r/1000}km` : `${r}m`;
    }

    document.getElementById('dial-btn').addEventListener('click', () => {
      radiusIndex = (radiusIndex + 1) % RADIUS_OPTIONS.length;
      document.getElementById('radius-val').textContent = getRadiusText(RADIUS_OPTIONS[radiusIndex]);
    });

    function updateSearchStatusUI(active) {
      const indicator = document.getElementById('status-indicator');
      const pauseBtn = document.getElementById('pause-toggle-btn');

      if (active) {
        indicator.textContent = "SEARCHING...";
        indicator.className = "status-indicator active";
        pauseBtn.textContent = "PAUSE SENSOR";
        pauseBtn.className = "btn-sheikah btn-pause-toggle";
      } else {
        indicator.textContent = "PAUSED";
        indicator.className = "status-indicator paused";
        pauseBtn.textContent = "RESUME SENSOR";
        pauseBtn.className = "btn-sheikah btn-pause-toggle paused";
      }
    }

    function startSearchFromSet() {
      initAudio();

      const inputVal = document.getElementById('keyword-input').value.trim();
      appState.activeKeyword = inputVal || "大学";
      appState.isTracking = true;
      appState.isPaused = false;

      const db = loadSavedData();
      const now = new Date().toISOString();
      if (!db.keywordHistory[appState.activeKeyword]) {
        db.keywordHistory[appState.activeKeyword] = { lastSearch: now, lastArrival: null };
      } else {
        db.keywordHistory[appState.activeKeyword].lastSearch = now;
      }
      saveAppData(db);

      updateSearchStatusUI(true);

      if (!watchId && 'geolocation' in navigator) {
        watchId = navigator.geolocation.watchPosition(onPositionUpdate, (err) => {
          document.getElementById('distance-info').textContent = "GPSエラー: " + err.message;
        }, { enableHighAccuracy: true });
      } else {
        executeSearch();
      }
    }

    document.getElementById('set-btn').addEventListener('click', startSearchFromSet);
    document.getElementById('keyword-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') startSearchFromSet();
    });

    document.getElementById('pause-toggle-btn').addEventListener('click', () => {
      if (!appState.isTracking) {
        startSearchFromSet();
        return;
      }

      appState.isPaused = !appState.isPaused;
      if (appState.isPaused) {
        if (radarTimer) clearTimeout(radarTimer);
        updateSearchStatusUI(false);
      } else {
        initAudio();
        updateSearchStatusUI(true);
        evaluateSensorCycle();
      }
    });

    const pageKeywords = document.getElementById('page-keywords');
    const pageHistory = document.getElementById('page-history');

    document.getElementById('open-keywords-btn').addEventListener('click', () => {
      renderKeywordsList();
      pageKeywords.classList.add('open');
    });

    document.getElementById('back-to-main').addEventListener('click', () => {
      pageKeywords.classList.remove('open');
      evaluateSensorCycle();
    });

    document.getElementById('back-to-keywords').addEventListener('click', () => {
      pageHistory.classList.remove('open');
      renderKeywordsList();
    });

    function setupSwipeBack(el, backCallback) {
      let startX = 0;
      el.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
      el.addEventListener('touchend', (e) => {
        const diffX = e.changedTouches[0].clientX - startX;
        if (diffX > 80) backCallback();
      }, { passive: true });
    }
    setupSwipeBack(pageKeywords, () => document.getElementById('back-to-main').click());
    setupSwipeBack(pageHistory, () => document.getElementById('back-to-keywords').click());

    // ===================================================
    // 7. リスト表示・ソート・トグル
    // ===================================================
    function renderKeywordsList() {
      const db = loadSavedData();
      const container = document.getElementById('keywords-list-container');
      container.innerHTML = '';

      const filterText = document.getElementById('keyword-filter').value.toLowerCase();
      const sortType = document.getElementById('sort-keywords').value;

      let keys = Object.keys(db.keywordHistory).filter(k => k.toLowerCase().includes(filterText));

      keys.sort((a, b) => {
        const dataA = db.keywordHistory[a];
        const dataB = db.keywordHistory[b];
        const countA = db.arrivals.filter(item => item.keyword === a).length;
        const countB = db.arrivals.filter(item => item.keyword === b).length;

        if (sortType === 'recent_search') {
          return new Date(dataB.lastSearch || 0) - new Date(dataA.lastSearch || 0);
        } else if (sortType === 'recent_arrival') {
          return new Date(dataB.lastArrival || 0) - new Date(dataA.lastArrival || 0);
        } else if (sortType === 'count_desc') {
          return countB - countA;
        }
      });

      keys.forEach(k => {
        const count = db.arrivals.filter(item => item.keyword === k).length;
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div>
            <div style="font-weight: bold; font-size: 1.05rem; color: #fff;">${k}</div>
            <div style="font-size: 0.75rem; color: #889; margin-top: 3px;">到達数: ${count} 箇所</div>
          </div>
          <div style="color: var(--sheikah-gold); font-size: 1.2rem;">▶</div>
        `;
        div.addEventListener('click', () => {
          appState.selectedKeywordForHistory = k;
          document.getElementById('history-header-title').textContent = `${k} の到達履歴`;
          renderHistoryList();
          pageHistory.classList.add('open');
        });
        container.appendChild(div);
      });
    }

    function renderHistoryList() {
      const db = loadSavedData();
      const container = document.getElementById('history-list-container');
      container.innerHTML = '';

      const sortType = document.getElementById('sort-history').value;
      let items = db.arrivals.filter(a => a.keyword === appState.selectedKeywordForHistory);

      items.sort((a, b) => {
        if (sortType === 'date_desc') return new Date(b.date) - new Date(a.date);
        if (sortType === 'date_asc') return new Date(a.date) - new Date(b.date);
        if (sortType === 'name_asc') return a.name.localeCompare(b.name, 'ja');
      });

      items.forEach(item => {
        const d = new Date(item.date);
        const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;

        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
          <div>
            <div style="font-weight: bold; color: #fff;">${item.name}</div>
            <div style="font-size: 0.75rem; color: #889; margin-top: 2px;">到達: ${dateStr}</div>
          </div>
          <button class="toggle-radar ${item.muted ? 'off' : 'active'}" data-id="${item.id}">
            ${item.muted ? 'レーダーOFF' : 'レーダーON'}
          </button>
        `;

        div.querySelector('.toggle-radar').addEventListener('click', (e) => {
          e.stopPropagation();
          item.muted = !item.muted;
          saveAppData(db);
          renderHistoryList();
        });

        container.appendChild(div);
      });
    }

    document.getElementById('keyword-filter').addEventListener('input', renderKeywordsList);
    document.getElementById('sort-keywords').addEventListener('change', renderKeywordsList);
    document.getElementById('sort-history').addEventListener('change', renderHistoryList);
  </script>
</body>
</html>
